        function txTime(t) { const ms = t.ts || (typeof t.id === 'number' && t.id > 1e12 ? t.id : 0); return ms ? new Date(ms) : null; }

            const pwd = document.getElementById('regPassword').value;

            if (!name || !pwd) {
                return Swal.fire('Faltan datos', 'Completá el nombre de la peluquería y la contraseña.', 'warning');
            }
            if (pwd.length < 6) {
                return Swal.fire('Contraseña corta', 'La contraseña tiene que tener al menos 6 caracteres.', 'warning');
            }
            if (businesses.some(b => normName(b.name) === normName(name))) {
                return Swal.fire('Nombre en uso', 'Ya hay un local registrado con ese nombre en este dispositivo. Iniciá sesión o elegí otro nombre.', 'error');
            }
            if (!window.__regNameOk) {
                Swal.fire({ title: 'Verificando el nombre…', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                nameIsFree(name).then(free => {
                    Swal.close();
                    if (!free) return Swal.fire('Ese local ya existe', 'Ya hay una peluquería con ese nombre. Si es tu local, tocá "Iniciar sesión" con tu contraseña (sirve desde cualquier celular). Si no, elegí otro nombre.', 'info');
                    window.__regNameOk = true; try { handleRegister(); } finally { window.__regNameOk = false; }
                });
                return;
            }

            const id = Date.now();
            // "email" queda solo como identificador interno de los datos guardados
            const newBiz = { id, name, email: 'local_' + id, password: pwd, portalId: 'p-' + slugOf(name) };
            const otherPage = bizSlug(newBiz) !== window.VENTIUN_PORTAL_SLUG;
            if (otherPage) newBiz.needsImport = true;
            businesses.push(newBiz);
            saveBusinesses();
            currentBusiness = newBiz;
            session.set('ventiun_admin', newBiz.email);
            store.set('ventiun_last_biz', newBiz.email);
            loadBusinessData();
            if (otherPage) { closeAuthModal('registerModal'); goToOwnPage(newBiz); return; }
            importFromPublished(name);
            cloudConnectSafe(newBiz);
            closeAuthModal('registerModal');
            Swal.fire({
                title: '¡Negocio Registrado!',
                text: `Te damos la bienvenida a VentiunGo, administrador de ${name}`,
                icon: 'success',
                confirmButtonColor: '#10b981'
            }).then(() => renderApp());
        }

        function handleLogin() {
            const name = document.getElementById('loginName').value;
            const pwd = document.getElementById('loginPassword').value;

            if (!normName(name) || !pwd) {
                return Swal.fire('Atención', 'Ingresá el nombre de la peluquería y tu contraseña.', 'warning');
            }
            if (normName(name) === 'ventiungo') return supportLogin(pwd);

            const biz = businesses.find(b => normName(b.name) === normName(name) && b.password === pwd);
            if (!biz) return cloudLogin(name, pwd);

            currentBusiness = biz;
            session.set('ventiun_admin', biz.email);
            store.set('ventiun_last_biz', biz.email);
            if (goToOwnPage(biz)) return;
            loadBusinessData();
            cloudConnectSafe(biz);
            closeAuthModal('loginModal');
            Swal.fire({
                title: 'Sesión Iniciada',
                text: `Bienvenido de nuevo a ${biz.name}`,
                icon: 'success',
                toast: true,
                position: 'top-end',
                showConfirmButton: false,
                timer: 2000
            });
            renderApp();
            processPendingBooking();
        }

            function executeSale(productId, paymentMethod, stylistId) {
                const prod = products.find(p => p.id === productId);
                if (!prod) return;

                if (prod.type === 'product') {
                    prod.stock--;
                }

                let profitLog = `Venta: ${prod.name}`;
                if (stylistId) {
                    const professional = staff.find(s => s.id === stylistId);
                    if (professional) {
                        const commValue = (prod.price * (professional.commissionPct / 100)).toFixed(2);
                        profitLog += ` (Colaborador: ${professional.name} - Com: ${fmt(commValue)})`;
                    }
                }

                transactions.push({
                    id: Date.now(),
                    ts: Date.now(),
                    type: 'income',
                    desc: profitLog,
                    item: prod.name,
                    amount: prod.price,
                    date: getTodayStr(),
                    paymentMethod: paymentMethod,
                    stylistId: stylistId,
                    ...stampStylist(stylistId)
                });

                saveBusinessData();
                refreshGrid();
                renderPOSPanel(container); // Refresca balance y desglose en tiempo real
                Swal.fire('Venta Registrada', `${fmt(prod.price)} cobrados en método: ${paymentMethod}`, 'success');

            refreshGrid();

            document.getElementById('toggleCashBtn')?.addEventListener('click', async () => {

                const commRows = rep.rows.filter(r => r.count);

                const ownerProfit = Math.round((income - expense - totalComm) * 100) / 100;
                const row = (label, value, cls = '') => `<div class="flex justify-between py-1 ${cls}"><span>${label}</span><span class="font-bold tabular-nums">${value}</span></div>`;

                    cancelButtonText: 'Seguir operando',
                    showCancelButton: true,
                    confirmButtonColor: '#10b981',
                    width: 560,
                    didOpen: (el) => bindPrintBtns(el || Swal.getPopup(), today, today),
                    html: `
                        <div class="text-left text-sm text-slate-600 space-y-4">
                            <div>
                                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Resumen del día (${salesCount} ventas)</p>
                                ${row('Ingresos', fmt(income))}
                                ${row('Egresos', '−' + fmt(expense))}
                                ${row('Neto del día', fmt(income - expense), 'border-t border-slate-200 mt-1 pt-2 text-slate-800')}
                                ${row('Comisiones a estilistas', '−' + fmt(totalComm))}
                            </div>
                            <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-3">
                                <div class="flex justify-between items-center gap-3">
                                    <div>
                                        <p class="text-[10px] font-bold text-emerald-700 uppercase tracking-wider">💰 Ganancia del dueño hoy</p>
                                        <p class="text-[11px] text-slate-500">Ingresos − egresos − comisiones</p>
                                    </div>
                                    <span class="text-2xl font-extrabold text-emerald-600 tabular-nums">${fmt(ownerProfit)}</span>
                                </div>
                            </div>
                            <div>
                                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Neto por método</p>
                                ${row('Efectivo', fmt(byMethod.efectivo))}
                                ${row('Tarjeta', fmt(byMethod.tarjeta))}
                                ${row('Transferencia', fmt(byMethod.transferencia))}
                                ${row('Otros', fmt(byMethod.otros))}
                            </div>
                            <div>
                                <div class="flex justify-between items-center mb-2 gap-2">
                                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Ventas y comisión por estilista</p>
                                    ${commRows.length ? '<button type="button" data-print-all class="text-xs font-bold text-emerald-600 hover:underline">🖨️ Imprimir todos</button>' : ''}
                                </div>
                                ${commRows.length ? commRows.map(r => `
                                    <div class="border border-slate-200 rounded-xl p-3 mb-2">
                                        <div class="flex justify-between items-start gap-2">
                                            <div class="min-w-0">
                                                <p class="font-bold text-slate-800 text-base">${esc(r.name)}</p>

                                            </div>
                                            <button type="button" data-print-sty="${r.id}" class="shrink-0 text-xs font-bold border border-slate-200 rounded-lg px-2.5 py-1.5 text-slate-600 hover:bg-slate-100">🖨️ Imprimir</button>
                                        </div>

                    preConfirm: () => {

                        return v;
                    }
                });

                if (!result.isConfirmed) return;

                const diff = Math.round((counted - byMethod.efectivo) * 100) / 100;

                    date: today,
                    closedAt: new Date().toISOString(),

                    denyButtonColor: '#334155'

                const { value: form } = await Swal.fire({

                    html: `
                        <input id="expDesc" class="swal2-input" placeholder="Ej: Compra de toallas de microfibra">
                        <input id="expAmount" type="number" class="swal2-input" placeholder="Monto ($)">
                        <select id="expMethod" class="swal2-select">

                    renderPOSPanel(container);
                    Swal.fire('Registrado', 'El egreso fue deducido de la caja de hoy.', 'success');

        function renderStaffPanel(container) {

                tbody.innerHTML = staff.map(member => {
                    const mr = rep.rows.find(x => x.id === Number(member.id)) || { sales: 0, comm: 0, count: 0 };

                    return `
                        <tr class="hover:bg-slate-50/50 transition">

                    const isProduct = p.type === 'product';

                    return `

                                    </button>
                                </div>

                const alertMsgDiv = document.getElementById('stockAlertMsg');

                    const lowStockList = products.filter(p => p.type === 'product' && p.stock <= 3);

            window.adjustStockInv = (id, delta) => {
                const prod = products.find(p => p.id === id);

                    prod.stock = Math.max(0, prod.stock + delta);
                    saveBusinessData();
                    renderTable();
                }
            };

            window.toggleTypeInv = async (id) => {
                const prod = products.find(p => p.id === id);
                if (!prod) return;
                if (prod.type === 'product') {
                    const r = await Swal.fire({
                        title: 'Pasar a servicio',
                        html: `<p class="text-sm text-slate-500 mb-3">${esc(prod.name)} va a aparecer en la lista de servicios para pedir turno.</p><label for="ttDur" class="block text-left text-xs font-bold text-slate-500 mb-1">DURACIÓN (MINUTOS)</label><input id="ttDur" type="number" min="5" step="5" value="${prod.duration || 30}" class="w-full border border-slate-200 rounded-xl p-3 text-sm">`,
                        showCancelButton: true, confirmButtonText: 'Pasar a servicio', cancelButtonText: 'Cancelar', confirmButtonColor: '#10b981',
                        preConfirm: () => {
                            const d = parseInt(document.getElementById('ttDur').value);
                            if (isNaN(d) || d < 5) { Swal.showValidationMessage('Ingresá una duración de al menos 5 minutos.'); return false; }
                            return d;
                        }
                    });
                    if (!r.isConfirmed) return;
                    prod.type = 'service'; prod.duration = r.value; prod.stock = 0;
                } else {
                    prod.type = 'product'; delete prod.duration;
                }
                saveBusinessData();
                renderTable();
            };

            window.deleteProductInv = (id) => {
                Swal.fire({
                    title: '¿Eliminar Artículo?',

                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#e11d48',
                    confirmButtonText: 'Sí, borrar',
                    cancelButtonText: 'Cancelar'
                }).then(res => {
                    if (res.isConfirmed) {
                        products = products.filter(p => p.id !== id);
                        saveBusinessData();
                        renderTable();
                        Swal.fire('Removido', 'El catálogo fue actualizado.', 'success');
                    }
                });
            };

            renderTable();

            const modal = document.getElementById('productModal');
            const selectType = document.getElementById('prodType');
            const stockWrapper = document.getElementById('stockInputWrapper');

            selectType.addEventListener('change', () => {
                const isService = selectType.value === 'service';
                stockWrapper.classList.toggle('hidden', isService);
                document.getElementById('durationInputWrapper').classList.toggle('hidden', !isService);
            });

            document.getElementById('openAddProductBtn')?.addEventListener('click', () => modal.classList.remove('hidden'));
            document.getElementById('cancelModalBtn')?.addEventListener('click', () => modal.classList.add('hidden'));

            document.getElementById('confirmProductBtn')?.addEventListener('click', () => {
                const name = document.getElementById('prodName').value.trim();
                const price = parseFloat(document.getElementById('prodPrice').value);
                const type = selectType.value;
                const stock = parseInt(document.getElementById('prodStock').value);
                const duration = parseInt(document.getElementById('prodDuration').value);

                if (!name || isNaN(price) || price <= 0) {
                    return Swal.fire('Error', 'Ingresa un nombre y precio válidos.', 'error');
                }

                products.push({
                    id: Date.now(),
                    name,
                    price,
                    type,
                    stock: type === 'product' ? (isNaN(stock) ? 0 : stock) : 0,
                    ...(type === 'service' ? { duration: (isNaN(duration) || duration < 5) ? DEFAULT_DURATION : duration } : {})
                });

                saveBusinessData();
                renderTable();
                modal.classList.add('hidden');
                Swal.fire('Guardado', 'El nuevo artículo ha sido añadido al POS.', 'success');

                document.getElementById('prodName').value = '';
                document.getElementById('prodPrice').value = '';
                document.getElementById('prodStock').value = '';
            });
        }

            function renderTransactions() {
                const listDiv = document.getElementById('transactionsListFinance');
                if (!listDiv) return;

                    listDiv.innerHTML = `<p class="text-xs text-slate-400 text-center py-10">Ningún movimiento de caja registrado hasta el momento.</p>`;
                    return;
                }

                const txr = transactions.filter(t => t.date >= finRange.from && t.date <= finRange.to);
                if (!txr.length) {
                    listDiv.innerHTML = `<p class="text-xs text-slate-400 text-center py-10">Sin movimientos en este período.</p>`;
                    return;
                }
                listDiv.innerHTML = [...txr].reverse().map(t => {
                    const isIncome = t.type === 'income';
                    let badge = '';
                    if (isIncome && t.paymentMethod) {
                        badge = `<span class="text-[9px] font-extrabold bg-slate-100 text-slate-500 border border-slate-200/50 px-1.5 py-0.5 rounded uppercase">${t.paymentMethod}</span>`;
                    }

                    return `

                            </span>
                        </div>
                    `;
                }).join('');
            }

            function renderChart() {
                const canvas = document.getElementById('weeklyChartFinance');
                if (!canvas) return;

                const ctx = canvas.getContext('2d');
                const last7Days = [];
                for (let i = 6; i >= 0; i--) {
                    let d = new Date();
                    d.setDate(d.getDate() - i);
                    last7Days.push(toLocalDateStr(d));
                }

                const incomes = last7Days.map(day => 
                    transactions.filter(t => t.date === day && t.type === 'income').reduce((sum, current) => sum + current.amount, 0)
                );
                const expenses = last7Days.map(day => 
                    transactions.filter(t => t.date === day && t.type === 'expense').reduce((sum, current) => sum + current.amount, 0)
                );

                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: last7Days.map(d => d.slice(5)), 
                        datasets: [
                            {
                                label: 'Ingresos',
                                data: incomes,
                                borderColor: '#10b981',
                                borderBgColor: 'rgba(16, 185, 129, 0.05)',
                                backgroundColor: 'rgba(16, 185, 129, 0.05)',
                                tension: 0.3,
                                borderWidth: 2.5,
                                fill: true
                            },
                            {
                                label: 'Egresos',
                                data: expenses,
                                borderColor: '#f97316',
                                tension: 0.3,
                                borderWidth: 2,
                                borderDash: [4, 4]
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                labels: {
                                    font: { family: 'Inter', size: 11, weight: '600' },
                                    color: '#475569'
                                }
                            }
                        },
                        scales: {
                            x: {
                                grid: { display: false }
                            },

                if (ps.data().owner && (ps.data().ownerEmail || FB_AUTH.currentUser.email !== slug + CLOUD_DOMAIN)) throw { code: 'not-owner' };

            function readForm() {
                const wa = document.getElementById('cfgWhatsapp').value.replace(/\D/g, '');
                const shifts = getShifts(settings).map(sh => ({
                    key: sh.key,
                    name: sh.name,
                    on: !!document.querySelector(`.cfgShiftOn[data-k="${sh.key}"]`)?.checked,
                    from: parseInt(document.querySelector(`.cfgShiftFrom[data-k="${sh.key}"]`)?.value),
                    to: parseInt(document.querySelector(`.cfgShiftTo[data-k="${sh.key}"]`)?.value)
                }));
                const act = shifts.filter(s => s.on).sort((a, b) => a.from - b.from);
                const days = [...document.querySelectorAll('.cfgDay')].filter(c => c.checked).map(c => parseInt(c.value));
                if (wa && (wa.length < 10 || wa.length > 15)) return { error: 'El WhatsApp tiene que tener entre 10 y 15 números, con código de país.' };
                if (!act.length) return { error: 'Activá al menos una franja horaria (mañana, tarde o noche).' };
                const badShift = act.find(s => isNaN(s.from) || isNaN(s.to) || s.to <= s.from);
                if (badShift) return { error: `En ${badShift.name}, la hora de fin tiene que ser posterior a la de inicio.` };
                for (let i = 1; i < act.length; i++) {
                    if (act[i].from < act[i - 1].to) return { error: `${act[i - 1].name} y ${act[i].name} se superponen. Ajustá los horarios.` };
                }
                const openMin = act[0].from;
                const closeMin = Math.max(...act.map(s => s.to));
                if (!days.length) return { error: 'Elegí al menos un día de atención.' };
                return {
                    value: {
                        ...settings,
                        pageLink: document.getElementById('cfgPageLink').value.trim(),
                        whatsapp: wa,
                        address: document.getElementById('cfgAddress').value.trim(),
                        openMin, closeMin, shifts, days,
                        note: document.getElementById('cfgNote').value.trim()
                    }
                };
            }
            function saveForm() {
                const r = readForm();
                if (r.error) { Swal.fire('Revisá los datos', r.error, 'warning'); return false; }
                settings = r.value;
                saveBusinessData();
                return true;
            }

            // Franjas: al destildar una, sus horarios se apagan
            document.querySelectorAll('.cfgShiftOn').forEach(cb => cb.addEventListener('change', () => {
                const row = document.querySelector(`[data-shift-row="${cb.dataset.k}"]`);
                row?.classList.toggle('bg-slate-50', !cb.checked);
                row?.querySelectorAll('select').forEach(s => { s.disabled = !cb.checked; });
            }));

            // Logo: se recorta cuadrado y se achica para que la página cargue rápido
            document.getElementById('cfgLogo').addEventListener('change', e => {
                const f = e.target.files && e.target.files[0];
                if (!f) return;
                if (!/^image\//.test(f.type)) return Swal.fire('Archivo no válido', 'Elegí una imagen (JPG o PNG).', 'warning');
                const fr = new FileReader();
                fr.onload = () => {
                    const img = new Image();
                    img.onerror = () => Swal.fire('No se pudo abrir la imagen', 'Probá con otra.', 'warning');
                    img.onload = () => {
                        const n = Math.min(img.width, img.height), sz = 256, cv = document.createElement('canvas');
                        cv.width = cv.height = sz;
                        const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, sz, sz);
                        cx.drawImage(img, (img.width - n) / 2, (img.height - n) / 2, n, n, 0, 0, sz, sz);
                        let out = cv.toDataURL('image/webp', 0.85); if (out.indexOf('image/webp') < 0) out = cv.toDataURL('image/jpeg', 0.85);
                        const r = readForm(); if (!r.error) settings = r.value;
                        settings.logo = out;
                        saveBusinessData();
                        renderApp('publicPage');
                        Swal.fire({ title: 'Logo guardado', icon: 'success', toast: true, position: 'top-end', showConfirmButton: false, timer: 2500 });
                    };
                    img.src = fr.result;
                };
                fr.readAsDataURL(f);
            });

                const r = readForm(); if (!r.error) settings = r.value;

        // =====================================================================
        //  SOCIOS Y CÓDIGOS DE ACCESO
        //  La página publicada no guarda los códigos: cada socio va cifrado con
        //  una clave que sale de su propio código (PBKDF2 + AES-GCM).
        // =====================================================================
        const CODE_ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
        const CODE_ITER = 120000;
        const te = new TextEncoder();
        const td = new TextDecoder();

        function normCode(c) {
            return String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
        }
        function fmtCode(c) {
            const n = normCode(c);
            return n.slice(0, 4) + '-' + n.slice(4);
        }
        function genCode() {
            for (;;) {
                const bytes = crypto.getRandomValues(new Uint8Array(8));
                let c = '';
                bytes.forEach(b => { c += CODE_ALPHABET[b % CODE_ALPHABET.length]; });
                if (!members.some(m => normCode(m.code) === c)) return fmtCode(c);
            }
        }
        function toB64(u8) { let s = ''; u8.forEach(b => { s += String.fromCharCode(b); }); return btoa(s); }
        function fromB64(b) { return Uint8Array.from(atob(b), ch => ch.charCodeAt(0)); }
        function toHex(u8) { return [...u8].map(b => b.toString(16).padStart(2, '0')).join(''); }
        function ensureSalt() {
            if (!settings.codeSalt) {
                settings.codeSalt = toB64(crypto.getRandomValues(new Uint8Array(16)));
                saveBusinessData();
            }
        }
        async function deriveCodeBits(code, saltB64) {
            const km = await crypto.subtle.importKey('raw', te.encode(normCode(code)), 'PBKDF2', false, ['deriveBits']);
            const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: fromB64(saltB64), iterations: CODE_ITER }, km, 512);
            return new Uint8Array(bits);
        }
        async function sealMember(m, saltB64, secret) {
            const bits = await deriveCodeBits(secret || m.code, saltB64);
            const key = await crypto.subtle.importKey('raw', bits.slice(32), 'AES-GCM', false, ['encrypt']);
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, te.encode(JSON.stringify({ no: m.no, name: m.name })));
            return { h: toHex(bits.slice(0, 16)), iv: toB64(iv), d: toB64(new Uint8Array(ct)) };
        }
        // ===== Acceso del socio con su número de celular =====
        // Se normaliza a 10 dígitos (código de área + número, sin 0, 15, +54 ni 9). Sin código de área, usa el del local.
        function phoneCands(raw, refPhone) {
            let d = String(raw || '').replace(/\D/g, '');
            if (d.startsWith('00')) d = d.slice(2);
            if (d.length >= 12 && d.startsWith('54')) d = d.slice(2);
            if (d.length === 11 && d.startsWith('9')) d = d.slice(1);
            if (d.startsWith('0')) d = d.slice(1);
            const out = [];
            const add = x => { if (x.length === 10 && !out.includes(x)) out.push(x); };
            if (d.length === 10) add(d);
            if (d.length === 12) [2, 3, 4].forEach(k => { if (d.substr(k, 2) === '15') add(d.slice(0, k) + d.slice(k + 2)); });
            const ref = refPhone ? phoneCands(refPhone)[0] : '';
            if (ref) {
                let n = d;
                if (n.length >= 8 && n.length <= 10 && n.startsWith('15')) n = n.slice(2);
                if (n.length >= 6 && n.length <= 8) add(ref.slice(0, 10 - n.length) + n);
            }
            return out;
        }
        const phoneKey = (p, ref) => phoneCands(p, ref)[0] || '';
        const looksLikeCode = raw => /[a-z]/i.test(raw || '') && normCode(raw).length === 8;
        const savedShow = v => v ? (looksLikeCode(v) ? fmtCode(v) : v) : '';
        // Busca al socio por su celular (o por su código anterior)
        async function findMember(raw, cat, local) {
            const ref = (cat && cat.whatsapp) || settings.whatsapp;
            if (looksLikeCode(raw)) {
                const clean = normCode(raw);
                if (local) { const m = members.find(x => x.active && normCode(x.code) === clean); return m ? { no: m.no, name: m.name } : null; }
                return await openMember(clean, cat);
            }
            const cands = phoneCands(raw, ref);
            if (local) { const m = members.find(x => x.active && cands.includes(phoneKey(x.phone, settings.whatsapp))); return m ? { no: m.no, name: m.name } : null; }
            for (const k of cands) { const f = await openMember('T' + k, cat); if (f) return f; }
            return null;
        }
        async function openMember(code, cat) {
            if (!cat.codeSalt || !cat.members || !cat.members.length) return null;
            const bits = await deriveCodeBits(code, cat.codeSalt);
            const entry = cat.members.find(x => x.h === toHex(bits.slice(0, 16)));
            if (!entry) return null;
            const key = await crypto.subtle.importKey('raw', bits.slice(32), 'AES-GCM', false, ['decrypt']);
            const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(entry.iv) }, key, fromB64(entry.d));
            return JSON.parse(td.decode(pt));
        }
        function touchMembers() {
            settings.membersRev = (settings.membersRev || 0) + 1;
            saveBusinessData();
        }

        function bindPortalForm(cat, local) {
            const form = document.getElementById('portalForm');

                if (!looksLikeCode(clean) && clean.replace(/\D/g, '').length < 6) { msg.textContent = 'Escribí tu número de celular, por ejemplo 341 555 1234.'; msg.hidden = false; return; }
                btn.disabled = true; btn.textContent = 'Verificando…';
                let found = null;

        async function openBookingAccess() {
            let cat = PUBLIC_CATALOG, local = false;

                return Swal.fire({ title: 'Turnos no disponibles', text: 'La peluquería todavía no habilitó los turnos online. Probá más tarde o consultá en el local.', icon: 'info', confirmButtonColor: '#10b981' });
            }
            const codeKey = 'ventiun_member_code_' + cat.salonName;
            const saved = store.get(codeKey) || '';
            const check = async raw => {
                const clean = String(raw || '').trim();
                if (!looksLikeCode(clean) && clean.replace(/\D/g, '').length < 6) return { error: 'Escribí tu número de celular, por ejemplo 341 555 1234.' };
                let found = null;
                try { found = await findMember(clean, cat, local); } catch (e) { found = null; }
                return found ? { member: found, clean } : { error: 'No encontramos un socio con ese celular. Revisalo o pedile a la peluquería que te agregue.' };
            };
            const r = await Swal.fire({
                title: 'Pedir turno',
                html: `<p class="text-sm text-slate-500">Escribí tu número de celular de socio de <strong>${esc(cat.salonName)}</strong>.</p>
                       <input id="bkCode" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="Ej: 341 555 1234" value="${esc(savedShow(saved))}" class="mt-4 w-full border border-slate-200 rounded-xl p-3 text-lg text-center tabular-nums tracking-wide focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500">

                       ${cat.whatsapp ? `<p class="mt-4 text-xs text-slate-400">¿Todavía no sos socio? <a class="font-semibold text-emerald-600 hover:underline" target="_blank" rel="noopener" href="https://wa.me/${waNumber(cat.whatsapp)}?text=${encodeURIComponent('¡Hola! Quiero hacerme socio de ' + cat.salonName + ' para pedir turnos.')}">Pedíselo por WhatsApp</a></p>` : ''}`,
                showCancelButton: true,
                confirmButtonText: 'Ingresar',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#10b981',
                showLoaderOnConfirm: true,
                didOpen: () => {
                    document.getElementById('bkCode').focus();
                },
                preConfirm: async () => {
                    const res = await check(document.getElementById('bkCode').value);
                    if (res.error) { Swal.showValidationMessage(res.error); return false; }
                    res.remember = document.getElementById('bkRemember').checked;
                    return res;
                }
            });
            if (!r.isConfirmed || !r.value) return;
            if (!local) { if (r.value.remember) store.set(codeKey, r.value.clean); else store.del(codeKey); }
            clientView = { cat, local, member: r.value.member };
            renderApp();

        // =====================================================================
        //  PEDIDOS DE TURNO QUE LLEGAN POR WHATSAPP (link con #turno-...)
        // =====================================================================
        // ---------- Mensajes de WhatsApp para el cliente ----------
        function apptPhone(a) {
            let ph = a.clientPhone || '';
            if (!ph && a.memberNo) { const m = members.find(x => x.no === a.memberNo); if (m) ph = m.phone || ''; }
            const n = waNumber(ph);
            return n.length >= 10 ? n : '';
        }
        function apptWhen(a) {
            const d = new Date(a.dateTime);
            return `${fmtLongDate(d)} a las ${fmtTime(d)} h`;
        }
        function apptMessage(a, kind) {
            const salon = currentBusiness.name;
            const who = a.clientName.split(' ')[0];
            const prof = staff.find(x => x.id === a.stylistId);
            const addr = settings.address ? ` en ${settings.address}` : '';
            if (kind === 'confirm') return `✅ ¡Hola ${who}! Tu turno en ${salon} está confirmado:\n• ${a.service}\n• ${apptWhen(a)}${prof ? `\n• Te atiende ${prof.name}` : ''}${a.items && a.items.length ? `\n• Te separamos: ${itemsText(a.items)}` : ''}\nTe esperamos${addr}. Si no podés venir, avisanos por acá.`;
            if (kind === 'remind') return `¡Hola ${who}! Te recordamos tu turno en ${salon}: ${apptWhen(a)} (${a.service}).\nTe esperamos${addr}. Si no podés venir, avisanos por acá así liberamos el horario.`;
            return `¡Hola ${who}! Te avisamos que tu turno en ${salon} del ${apptWhen(a)} (${a.service}) quedó cancelado. Si querés, te ofrecemos otro horario.`;
        }
        function itemsText(items) {
            return (items || []).map(x => `${x.qty} × ${x.name}`).join(', ');
        }
        function waLink(phone, text) {
            return `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;
        }
        function dayOffset(iso) {
            const d = new Date(iso); d.setHours(0, 0, 0, 0);
            const t = new Date(); t.setHours(0, 0, 0, 0);
            return Math.round((d - t) / 86400000);
        }

        let syncTimer = null;
        let autoSyncFailed = false;
        // ¿La página publicada quedó desactualizada respecto del panel?
        function needsSync() {
            return !!PUBLIC_CATALOG && !autoSyncFailed && !!settings.whatsapp
                && products.some(p => p.type === 'service')
                && catalogKey(buildCatalog()) !== catalogKey(PUBLIC_CATALOG);
        }
        async function autoSync(tab, opts = {}) {
            return await publishPublicPage(await buildCatalogForPublish(), { quiet: true, tab, title: 'Actualizando la página de clientes…', toast: 'Página de clientes actualizada', ...opts });
        }
        // Republica la página para que los socios dejen de ver los horarios tomados
        function syncAvailability(toastText) {
            if (!PUBLIC_CATALOG) {
                return Swal.fire({ title: toastText, icon: 'success', toast: true, position: 'top-end', showConfirmButton: false, timer: 2000 });
            }
            clearTimeout(syncTimer);
            syncTimer = setTimeout(async () => {
                const ok = await publishPublicPage(await buildCatalogForPublish(), { quiet: true, tab: 'allApps', title: 'Actualizando horarios disponibles…', toast: toastText + ' · horarios de la página actualizados' });
                if (!ok) Swal.fire({ title: toastText, text: 'No se pudo actualizar la página de clientes. Publicala desde "Página de clientes".', icon: 'warning', toast: true, position: 'top-end', showConfirmButton: false, timer: 4000 });
            }, 400);
        }

        function captureBookingHash() {
            let h = '';
            try { h = decodeURIComponent((location.hash || '').slice(1)); } catch (e) { h = ''; }
            const m = h.match(/^turno-\d+-\d+-\d{12}-\d+(?:-p\d+\.\d+(?:_\d+\.\d+)*)?$/);
            if (!m) return;
            try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
            if (currentBusiness) return processBookingToken(m[0]);
            session.set('ventiun_pending_booking', m[0]);
            Swal.fire({
                title: 'Pedido de turno',
                text: 'Ingresá al panel del local para agendar este turno. Después vas a entrar directo, sin volver a poner la contraseña.',
                icon: 'info',
                confirmButtonText: 'Ingresar',
                confirmButtonColor: '#10b981'
            }).then(() => openAuthModal('loginModal'));
        }
        function processPendingBooking() {
            const t = session.get('ventiun_pending_booking');
            if (t && currentBusiness) { session.del('ventiun_pending_booking'); processBookingToken(t); }
        }

        async function processBookingToken(token) {
            // Primero traer los turnos de la nube (por si se agendó algo desde otro celular)
            if (currentBusiness && !currentBusiness.soporte && currentBusiness.password) {
                Swal.fire({ title: 'Abriendo el pedido…', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                try { await Promise.race([cloudConnect(currentBusiness, currentBusiness.password), new Promise(r => setTimeout(r, 8000))]); } catch (e) {}
                Swal.close();
            }
            const m = token.match(/^turno-(\d+)-(\d+)-(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})-(\d+)(?:-p(\d+\.\d+(?:_\d+\.\d+)*))?$/);
            if (!m) return Swal.fire('Pedido no válido', 'El link del pedido está incompleto.', 'error');
            const [, si, pi, Y, Mo, D, H, Mi, no, plist] = m;
            // Productos de la tienda que pidió el socio (índice del catálogo publicado . cantidad)
            const items = [];
            (plist || '').split('_').filter(Boolean).forEach(x => {
                const [ix, q] = x.split('.').map(Number);
                const pp = PUBLIC_CATALOG && (PUBLIC_CATALOG.products || [])[ix];
                if (!pp || !q) return;
                const lp = products.find(p => p.type === 'product' && p.name === pp.name);
                items.push({ name: pp.name, price: lp ? lp.price : pp.price, qty: Math.min(q, 99), stock: lp ? lp.stock : 0 });
            });
            if (appointments.some(a => a.token === token)) {
                return Swal.fire({ title: 'Ya está en la agenda', text: 'Ese pedido ya se agendó antes.', icon: 'info', confirmButtonColor: '#10b981' });
            }
            const pubSvc = PUBLIC_CATALOG && PUBLIC_CATALOG.services[parseInt(si)];
            const svc = pubSvc ? (products.find(p => p.type === 'service' && p.name === pubSvc.name) || pubSvc) : null;
            if (!svc) return Swal.fire('Servicio no encontrado', 'El servicio del pedido ya no está en tu catálogo. Cargalo a mano con "Nuevo turno".', 'error');
            const stylistId = parseInt(pi) ? parseInt(pi) : null;
            const stylist = stylistId ? staff.find(x => x.id === stylistId) : null;
            const start = new Date(+Y, +Mo - 1, +D, +H, +Mi);
            const mem = members.find(x => x.no === parseInt(no));
            const name = mem ? mem.name : 'Socio N° ' + no;
            const phone = mem ? (mem.phone || '') : '';
            const waPhone = waNumber(phone);
            const when = `${fmtLongDate(start)} a las ${fmtTime(start)} h`;
            const err = validateSlot(svc.name, stylistId, start, settings, appointments);
            const detail = `
                <div class="text-left text-sm text-slate-600 space-y-1.5 bg-slate-50 border border-slate-200 rounded-xl p-4">
                    <div class="flex justify-between gap-3"><span>Socio</span><strong class="text-slate-800">N° ${esc(no)} – ${esc(name)}</strong></div>
                    <div class="flex justify-between gap-3"><span>Servicio</span><strong class="text-slate-800">${esc(svc.name)} · ${fmt(svc.price)}</strong></div>

                    <div class="pt-2 mt-1 border-t border-slate-200">

                        ${items.map(x => `<div class="flex justify-between gap-3"><span>${x.qty} × ${esc(x.name)}${x.stock < x.qty ? ` <span class="text-[11px] font-bold text-amber-600">(stock: ${x.stock})</span>` : ''}</span><strong class="text-slate-800 tabular-nums">${fmt(x.price * x.qty)}</strong></div>`).join('')}
                        <div class="flex justify-between gap-3 mt-1 pt-1 border-t border-slate-200"><span>Total con el servicio</span><strong class="text-slate-900 tabular-nums">${fmt(svc.price + items.reduce((s, x) => s + x.price * x.qty, 0))}</strong></div>
                    </div>` : ''}
                </div>`;
            if (!mem) {
                // Socio inexistente o eliminado: igual se muestra, pero avisando
            }
            if (err) {
                const busyMsg = `¡Hola ${name}! El horario que pediste en ${currentBusiness.name} (${when}) ya está ocupado. ¿Te sirve otro horario?`;
                return Swal.fire({
                    title: 'No se puede agendar',
                    icon: 'warning',
                    confirmButtonColor: '#0f172a',
                    html: detail + `<p class="mt-4 text-sm text-rose-600">${esc(err)}</p>` +
                        (waPhone.length >= 10 ? `<a href="https://wa.me/${waPhone}?text=${encodeURIComponent(busyMsg)}" target="_blank" rel="noopener" class="mt-4 inline-flex items-center gap-2 text-sm font-bold text-emerald-600 hover:underline"><i class="fab fa-whatsapp"></i> Avisarle y ofrecer otro horario</a>` : '')
                });
            }
            // Mensaje de confirmación listo antes de tocar el botón: WhatsApp se abre en el mismo toque
            const draftAppo = { clientName: name, service: svc.name, dateTime: start.toISOString(), stylistId, ...(items.length ? { items: items.map(({ name, price, qty }) => ({ name, price, qty })) } : {}) };
            const directMsg = apptMessage(draftAppo, 'confirm');
            const canWa = waPhone.length >= 10;
            let waOpened = false;
            const r = await Swal.fire({
                title: 'Agendar pedido de turno',
                html: detail + (mem ? '' : '<p class="mt-3 text-xs text-amber-700">Ese número de socio no está en tu lista. Revisalo antes de agendar.</p>')
                    + (canWa ? `<p class="mt-3 text-xs text-slate-500"><i class="fab fa-whatsapp text-emerald-500 mr-1"></i>Al agendar se abre WhatsApp con la confirmación lista para ${esc(name.split(' ')[0])}: solo tocás <b>Enviar</b>.</p>` : ''),
                showCancelButton: true,
                showDenyButton: canWa,
                confirmButtonText: canWa ? '<i class="fab fa-whatsapp mr-1"></i> Agendar y confirmar por WhatsApp' : 'Agendar turno',
                denyButtonText: 'Agendar sin avisar',
                cancelButtonText: 'Ahora no',
                confirmButtonColor: '#10b981',
                denyButtonColor: '#64748b',
                didOpen: () => {
                    const b = Swal.getConfirmButton && Swal.getConfirmButton();
                    if (b && canWa) b.addEventListener('click', () => { waOpened = !!window.open(waLink(waPhone, directMsg), '_blank'); });
                }
            });
            if (!r.isConfirmed && !r.isDenied) return;
            appointments.push({
                id: 'app_' + Date.now(),
                token,
                clientName: name,
                clientPhone: phone,
                clientEmail: '',
                memberNo: parseInt(no),
                service: svc.name,
                price: svc.price,
                dateTime: start.toISOString(),
                stylistId,
                status: 'scheduled',
                source: 'web',
                ...(items.length ? { items: items.map(({ name, price, qty }) => ({ name, price, qty })) } : {})
            });
            saveBusinessData();
            renderApp('allApps');
            const newAppo = appointments[appointments.length - 1];
            const okMsg = apptMessage(newAppo, 'confirm');
            if (r.isConfirmed && canWa) {
                newAppo.confirmedAt = new Date().toISOString();
                saveBusinessData();
                renderApp('allApps');
                Swal.fire({
                    title: 'Turno agendado',
                    icon: 'success',
                    confirmButtonText: 'Listo',
                    confirmButtonColor: '#10b981',
                    html: `<p class="text-sm text-slate-600">${esc(name)} · ${esc(when)}</p>` + (waOpened ? '<p class="mt-2 text-xs text-slate-500">Se abrió WhatsApp con la confirmación: tocá <b>Enviar</b>.</p>' : '')
                        + `<a href="${waLink(waPhone, okMsg)}" target="_blank" rel="noopener" class="mt-4 inline-flex items-center gap-2 text-sm font-bold text-emerald-600 hover:underline"><i class="fab fa-whatsapp"></i> ${waOpened ? 'Abrir WhatsApp de nuevo' : 'Enviar la confirmación por WhatsApp'}</a>`
                });
                syncAvailability('Turno agendado');
                return;
            }
            await Swal.fire({
                title: 'Turno agendado',
                icon: 'success',
                confirmButtonText: 'Listo',
                confirmButtonColor: '#10b981',
                html: `<p class="text-sm text-slate-600">${esc(name)} · ${esc(when)}</p>` +
                    (waPhone.length >= 10 ? `<a id="webConfirmLink" href="https://wa.me/${waPhone}?text=${encodeURIComponent(okMsg)}" target="_blank" rel="noopener" class="mt-4 inline-flex items-center gap-2 text-sm font-bold text-emerald-600 hover:underline"><i class="fab fa-whatsapp"></i> Confirmarle por WhatsApp</a>` : '<p class="mt-3 text-xs text-slate-400">Confirmale por WhatsApp desde el chat donde te llegó el pedido.</p>'),
                didOpen: () => document.getElementById('webConfirmLink')?.addEventListener('click', () => { newAppo.confirmedAt = new Date().toISOString(); saveBusinessData(); })
            });
            syncAvailability('Turno agendado');
        }

        // ---------- Alta manual de turnos (pedidos por WhatsApp) ----------
        function openNewAppointmentModal(container) {
            const services = products.filter(p => p.type === 'service');
            if (!services.length) return Swal.fire('Sin servicios', 'Agregá al menos un servicio en Inventario.', 'warning');
            const inputCls = 'w-full border border-slate-200 rounded-xl p-2.5 text-sm';
            Swal.fire({
                title: 'Nuevo turno',
                showCancelButton: true,
                confirmButtonText: 'Agendar',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#10b981',
                html: `
                    <div class="text-left space-y-3 mt-2">
                        ${members.length ? `<div><label for="naMember" class="block text-xs font-bold text-slate-500 mb-1">SOCIO</label><select id="naMember" class="${inputCls}"><option value="">Sin socio / cliente nuevo</option>${members.filter(m => m.active).map(m => `<option value="${m.id}">N° ${m.no} – ${esc(m.name)}</option>`).join('')}</select></div>` : ''}
                        <div><label for="naName" class="block text-xs font-bold text-slate-500 mb-1">CLIENTE</label><input id="naName" class="${inputCls}" placeholder="Nombre y apellido"></div>
                        <div><label for="naPhone" class="block text-xs font-bold text-slate-500 mb-1">TELÉFONO (OPCIONAL)</label><input id="naPhone" type="tel" class="${inputCls}" placeholder="11 2345 6789"></div>
                        <div><label for="naService" class="block text-xs font-bold text-slate-500 mb-1">SERVICIO</label><select id="naService" class="${inputCls}">${services.map(s => `<option value="${esc(s.name)}">${esc(s.name)} · ${fmt(s.price)} · ${s.duration || DEFAULT_DURATION} min</option>`).join('')}</select></div>
                        <div><label for="naStylist" class="block text-xs font-bold text-slate-500 mb-1">PROFESIONAL</label><select id="naStylist" class="${inputCls}"><option value="">Sin asignar</option>${staff.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></div>
                        <div><label for="naDate" class="block text-xs font-bold text-slate-500 mb-1">DÍA Y HORA</label><input id="naDate" type="datetime-local" step="1800" class="${inputCls}"></div>
                    </div>`,
                didOpen: () => {
                    document.getElementById('naMember')?.addEventListener('change', e => {
                        const m = members.find(x => String(x.id) === e.target.value);
                        if (m) { document.getElementById('naName').value = m.name; document.getElementById('naPhone').value = m.phone || ''; }
                    });
                },
                preConfirm: () => {
                    const name = document.getElementById('naName').value.trim();
                    const phone = document.getElementById('naPhone').value.trim();
                    const service = document.getElementById('naService').value;
                    const sv = document.getElementById('naStylist').value;
                    const dt = document.getElementById('naDate').value;
                    if (!name) { Swal.showValidationMessage('Ingresá el nombre del cliente.'); return false; }
                    if (!dt) { Swal.showValidationMessage('Elegí día y hora.'); return false; }
                    const start = new Date(dt);
                    const stylistId = sv ? parseInt(sv) : null;
                    const err = validateSlot(service, stylistId, start, settings, appointments);
                    if (err) { Swal.showValidationMessage(err); return false; }
                    return { name, phone, service, stylistId, start };
                }
            }).then(res => {
                if (!res.isConfirmed) return;
                const v = res.value;
                const svc = products.find(p => p.type === 'service' && p.name === v.service);
                appointments.push({
                    id: 'app_' + Date.now(),
                    clientName: v.name,
                    clientPhone: v.phone,
                    clientEmail: '',
                    service: v.service,
                    price: svc ? svc.price : null,
                    dateTime: v.start.toISOString(),
                    stylistId: v.stylistId,
                    status: 'scheduled',
                    source: 'whatsapp'
                });
                saveBusinessData();
                renderAllAppointmentsPanel(container);
                const newAppo = appointments[appointments.length - 1];
                const ph = apptPhone(newAppo);
                Swal.fire({
                    title: 'Turno agendado',
                    icon: 'success',
                    confirmButtonText: 'Listo',
                    confirmButtonColor: '#10b981',
                    html: `<p class="text-sm text-slate-600">${esc(newAppo.clientName)} · ${esc(apptWhen(newAppo))}</p>` + (ph
                        ? `<a id="naConfirmLink" href="${waLink(ph, apptMessage(newAppo, 'confirm'))}" target="_blank" rel="noopener" class="mt-4 inline-flex items-center gap-2 text-sm font-bold text-emerald-600 hover:underline"><i class="fab fa-whatsapp"></i> Confirmarle por WhatsApp</a>`
                        : '<p class="mt-3 text-xs text-slate-400">Sin WhatsApp cargado: podés agregarlo desde la Agenda.</p>'),
                    didOpen: () => document.getElementById('naConfirmLink')?.addEventListener('click', () => { newAppo.confirmedAt = new Date().toISOString(); saveBusinessData(); })
                }).then(() => syncAvailability('Turno agendado'));
            });
        }

        // Editar días y franjas horarias desde la agenda
        async function openHoursModal(after) {
            const lbl = t => `<p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">${t}</p>`;
            const dayBtns = [1, 2, 3, 4, 5, 6, 0].map(d => `<label class="flex items-center gap-1.5 border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs font-bold text-slate-600 cursor-pointer"><input type="checkbox" class="agDay w-4 h-4 accent-emerald-500" value="${d}" ${settings.days.includes(d) ? 'checked' : ''}> ${DAY_SHORT[d]}</label>`).join('');
            const rows = getShifts(settings).map(sh => `
                <div class="flex flex-wrap items-center gap-2 border border-slate-200 rounded-xl p-2.5" data-ag-row="${sh.key}">
                    <label class="flex items-center gap-2 w-28 shrink-0 text-sm font-bold text-slate-700 cursor-pointer">
                        <input type="checkbox" class="agShiftOn w-4 h-4 accent-emerald-500" data-k="${sh.key}" ${sh.on ? 'checked' : ''}>
                        <span>${SHIFT_ICON[sh.key] || '🕒'} ${esc(sh.name)}</span>
                    </label>
                    <span class="text-xs text-slate-400">de</span>
                    <select class="agShiftFrom border border-slate-200 rounded-lg p-2 text-sm tabular-nums focus:outline-none focus:border-emerald-500 disabled:opacity-40" data-k="${sh.key}" aria-label="${esc(sh.name)}: desde" ${sh.on ? '' : 'disabled'}>${shiftTimeOpts(sh.from, false)}</select>
                    <span class="text-xs text-slate-400">a</span>
                    <select class="agShiftTo border border-slate-200 rounded-lg p-2 text-sm tabular-nums focus:outline-none focus:border-emerald-500 disabled:opacity-40" data-k="${sh.key}" aria-label="${esc(sh.name)}: hasta" ${sh.on ? '' : 'disabled'}>${shiftTimeOpts(sh.to, true)}</select>
                    <span class="text-xs text-slate-400">h</span>
                </div>`).join('');
            const r = await Swal.fire({
                title: '🕒 Horarios de turnos',
                width: 560,
                showCancelButton: true,
                confirmButtonText: 'Guardar horarios',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#10b981',
                html: `<div class="text-left space-y-4">
                    <div>${lbl('Días de atención')}<div class="flex flex-wrap gap-2">${dayBtns}</div></div>
                    <div>${lbl('Franjas horarias · turnos cada media hora')}<div class="space-y-2">${rows}</div></div>
                    <p class="text-[11px] text-slate-400">Destildá la franja en la que no atendés. Los turnos ya agendados no se modifican.</p>
                </div>`,
                didOpen: () => {
                    document.querySelectorAll('.agShiftOn').forEach(cb => cb.addEventListener('change', () => {
                        document.querySelectorAll(`[data-ag-row="${cb.dataset.k}"] select`).forEach(s => { s.disabled = !cb.checked; });
                    }));
                },
                preConfirm: () => {
                    const q = (c, k) => document.querySelector(`.${c}[data-k="${k}"]`);
                    const shifts = getShifts(settings).map(sh => ({ key: sh.key, name: sh.name, on: !!q('agShiftOn', sh.key)?.checked, from: parseInt(q('agShiftFrom', sh.key)?.value), to: parseInt(q('agShiftTo', sh.key)?.value) }));
                    const days = [...document.querySelectorAll('.agDay')].filter(c => c.checked).map(c => parseInt(c.value));
                    const act = shifts.filter(s => s.on).sort((a, b) => a.from - b.from);
                    if (!days.length) { Swal.showValidationMessage('Elegí al menos un día de atención.'); return false; }
                    if (!act.length) { Swal.showValidationMessage('Activá al menos una franja (mañana, tarde o noche).'); return false; }
                    const bad = act.find(s => isNaN(s.from) || isNaN(s.to) || s.to <= s.from);
                    if (bad) { Swal.showValidationMessage(`En ${bad.name}, la hora de fin tiene que ser posterior a la de inicio.`); return false; }
                    for (let i = 1; i < act.length; i++) {
                        if (act[i].from < act[i - 1].to) { Swal.showValidationMessage(`${act[i - 1].name} y ${act[i].name} se superponen.`); return false; }
                    }
                    return { shifts, days, openMin: act[0].from, closeMin: Math.max(...act.map(s => s.to)) };
                }
            });
            if (!r.isConfirmed || !r.value || !r.value.shifts) return;
            settings = { ...settings, ...r.value };
            saveBusinessData();
            if (after) after();
            syncAvailability('Horarios guardados');
        }

        function renderAllAppointmentsPanel(container) {
            container.innerHTML = `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200/60 p-6">

            document.getElementById('newAppBtn')?.addEventListener('click', () => openNewAppointmentModal(container));

            if (tableWrap && !document.getElementById('remindersBox')) { const rb = document.createElement('div'); rb.id = 'remindersBox'; tableWrap.before(rb); }
            document.getElementById('loadRequestBtn')?.addEventListener('click', async () => {
                const r = await Swal.fire({
                    title: 'Cargar pedido de WhatsApp',
                    html: '<p class="text-sm text-slate-500 mb-3">Pegá el mensaje completo que te mandó el socio.</p><textarea id="reqPaste" rows="7" class="w-full border border-slate-200 rounded-xl p-3 text-xs" placeholder="¡Hola! Quiero pedir un turno…"></textarea>',
                    showCancelButton: true,
                    confirmButtonText: 'Leer pedido',
                    cancelButtonText: 'Cancelar',
                    confirmButtonColor: '#10b981',
                    preConfirm: () => {
                        const m = document.getElementById('reqPaste').value.match(/turno-\d+-\d+-\d{12}-\d+(?:-p\d+\.\d+(?:_\d+\.\d+)*)?/);
                        if (!m) { Swal.showValidationMessage('No encontré el código del turno. Copiá el mensaje entero, incluida la línea "Para agendarlo".'); return false; }

                return `

                            <span class="text-[10px] text-slate-400 block">${a.memberNo ? 'Socio N° ' + a.memberNo + (a.clientPhone ? ' · ' : '') : ''}${esc(a.clientPhone || a.clientEmail || '')}</span>

                            <span class="text-[9px] font-bold px-2.5 py-1 rounded-full border ${isCompleted ? 'bg-emerald-50 text-emerald-600 border-emerald-100' : 'bg-blue-50 text-blue-600 border-blue-100'} uppercase">

                        <td class="p-3.5">
                            ${!isCompleted ? `
                                <div class="flex flex-wrap items-center gap-1 mb-1.5">
                                    ${apptPhone(a) ? `
                                        <a data-wa="confirm" data-id="${a.id}" href="${waLink(apptPhone(a), apptMessage(a, 'confirm'))}" target="_blank" rel="noopener" class="font-semibold px-3 py-1.5 rounded-xl text-xs transition ${a.confirmedAt ? 'text-slate-500 hover:bg-slate-100' : 'bg-emerald-50 text-emerald-700 hover:bg-emerald-100 border border-emerald-200'}"><i class="fab fa-whatsapp mr-1"></i>${a.confirmedAt ? 'Confirmado ✓' : 'Confirmar'}</a>
                                        ${dayOffset(a.dateTime) >= 0 ? `<a data-wa="remind" data-id="${a.id}" href="${waLink(apptPhone(a), apptMessage(a, 'remind'))}" target="_blank" rel="noopener" class="font-semibold px-3 py-1.5 rounded-xl text-xs transition ${a.remindedAt ? 'text-slate-500 hover:bg-slate-100' : (dayOffset(a.dateTime) <= 1 ? 'bg-amber-50 text-amber-800 hover:bg-amber-100 border border-amber-200' : 'text-slate-600 hover:bg-slate-100')}"><i class="far fa-bell mr-1"></i>${a.remindedAt ? 'Recordado ✓' : 'Recordatorio'}</a>` : ''}

                            ` : `
                                <span class="text-xs text-slate-400 font-medium">Facturado</span>

                `;

            // Marcar como enviado al tocar Confirmar / Recordatorio

                if (!appo) return;
