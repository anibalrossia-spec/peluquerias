                setTimeout(() => renderAllAppointmentsPanel(container), 400);
            }));

            const dueReminders = appointments.filter(a => a.status !== 'completed' && !a.remindedAt && apptPhone(a) && [0, 1].includes(dayOffset(a.dateTime)) && new Date(a.dateTime) > new Date());
            const remBox = document.getElementById('remindersBox');
            if (remBox && dueReminders.length) {
                remBox.innerHTML = `<div class="mb-4 flex flex-wrap items-center gap-2 p-3.5 rounded-xl bg-amber-50 border border-amber-200 text-xs text-amber-900"><i class="far fa-bell"></i><span><strong>${dueReminders.length === 1 ? '1 turno de hoy o mañana' : dueReminders.length + ' turnos de hoy o mañana'}</strong> sin recordatorio. Tocá "Recordatorio" en cada uno para avisarle por WhatsApp.</span></div>`;
            }

            window.addPhoneAppt = async (appointmentId) => {
                const appo = appointments.find(a => a.id === appointmentId);
                if (!appo) return;
                const r = await Swal.fire({
                    title: 'WhatsApp del cliente',
                    html: `<p class="text-sm text-slate-500 mb-3">${esc(appo.clientName)}</p><input id="apPhone" type="tel" class="w-full border border-slate-200 rounded-xl p-3 text-sm" placeholder="3415551111">`,
                    showCancelButton: true, confirmButtonText: 'Guardar', cancelButtonText: 'Cancelar', confirmButtonColor: '#10b981',
                    preConfirm: () => {
                        const v = document.getElementById('apPhone').value.trim();
                        if (waNumber(v).length < 10) { Swal.showValidationMessage('Ingresá el número con característica, por ejemplo 3415551111.'); return false; }
                        return v;
                    }
                });
                if (!r.isConfirmed) return;
                appo.clientPhone = r.value;
                const mem = appo.memberNo && members.find(x => x.no === appo.memberNo);
                if (mem && !mem.phone) mem.phone = r.value;
                saveBusinessData();
                renderAllAppointmentsPanel(container);
            };

            window.cancelAppointmentAdmin = async (appointmentId) => {
                const appo = appointments.find(a => a.id === appointmentId);
                if (!appo) return;
                const r = await Swal.fire({ title: '¿Cancelar este turno?', text: `${appo.clientName} · ${fmtDateTime(appo.dateTime)}. El horario vuelve a quedar libre para los socios.`, showCancelButton: true, confirmButtonText: 'Cancelar turno', cancelButtonText: 'Volver', confirmButtonColor: '#e11d48' });
                if (!r.isConfirmed) return;
                appointments = appointments.filter(a => a.id !== appointmentId);
                saveBusinessData();
                renderAllAppointmentsPanel(container);
                const ph = apptPhone(appo);
                if (ph) {
                    await Swal.fire({
                        title: 'Turno cancelado',
                        icon: 'success',
                        confirmButtonText: 'Listo',
                        confirmButtonColor: '#10b981',
                        html: `<a href="${waLink(ph, apptMessage(appo, 'cancel'))}" target="_blank" rel="noopener" class="inline-flex items-center gap-2 text-sm font-bold text-emerald-600 hover:underline"><i class="fab fa-whatsapp"></i> Avisarle por WhatsApp</a>`
                    });
                }
                syncAvailability('Turno cancelado y horario liberado');
            };

            window.checkoutAppointment = (appointmentId) => {
                if (!cashOpen) {
                    return Swal.fire('Caja Cerrada', 'Es necesario abrir el turno de caja antes de cobrar turnos.', 'warning');
                }

                const appo = appointments.find(a => a.id === appointmentId);
                if (!appo) return;

                const matchingService = products.find(p => p.name === appo.service);
                const defaultPrice = matchingService ? matchingService.price : (appo.price ?? '');

                let stylistOptions = '<option value="">Ninguno / Venta directa</option>';
                staff.forEach(member => {
                    const isSelected = member.id === appo.stylistId ? 'selected' : '';
                    stylistOptions += `<option value="${member.id}" ${isSelected}>${esc(member.name)} (${esc(member.role)})</option>`;
                });

                Swal.fire({
                    title: 'Cobrar turno',
                    text: `Checkout rápido para el turno de ${appo.clientName}`,
                    icon: 'info',
                    showCancelButton: true,
                    confirmButtonColor: '#10b981',
                    confirmButtonText: 'Registrar Cobro',
                    html: `
                        <div class="text-left mt-3 space-y-3">
                            <div>
                                <label class="block text-xs font-bold text-slate-500 mb-1">SERVICIO A COBRAR</label>
                                <input class="swal2-input !w-full !m-0" value="${esc(appo.service)}" disabled>
                            </div>
                            <div>
                                <label for="checkoutPrice" class="block text-xs font-bold text-slate-500 mb-1">IMPORTE A COBRAR ($)</label>
                                <input id="checkoutPrice" type="number" step="0.01" min="0" class="swal2-input !w-full !m-0" value="${defaultPrice}">
                                ${matchingService ? '' : '<p class="text-[11px] text-amber-600 mt-1">Este servicio ya no está en el catálogo. Revisá el importe.</p>'}
                            </div>
                            ${appo.items && appo.items.length ? `
                            <div class="rounded-xl border border-slate-200 p-3">
                                <label class="flex items-start gap-2 text-sm text-slate-700">
                                    <input id="checkoutItems" type="checkbox" class="mt-1 accent-emerald-500" checked>
                                    <span><strong>Cobrar y entregar los productos del pedido</strong>
                                    <span class="block text-xs text-slate-500 mt-0.5">${esc(itemsText(appo.items))} · ${fmt(appo.items.reduce((s, x) => s + x.price * x.qty, 0))}. Se descuentan del stock.</span></span>
                                </label>
                            </div>` : ''}
                            <div>
                                <label class="block text-xs font-bold text-slate-500 mb-1">MÉTODO DE PAGO</label>
                                <select id="checkoutMethodSelect" class="swal2-select w-full border rounded-xl p-2.5 text-sm focus:outline-none">
                                    <option value="efectivo">💵 Efectivo</option>
                                    <option value="tarjeta">💳 Tarjeta (Débito / Crédito)</option>
                                    <option value="transferencia">🏦 Transferencia Bancaria</option>
                                    <option value="otros">📱 Pago Móvil / Otros</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 mb-1">ASIGNAR PROFESIONAL (LIQUIDA COMISIÓN)</label>
                                <select id="checkoutStylistSelect" class="swal2-select w-full border rounded-xl p-2.5 text-sm focus:outline-none">
                                    ${stylistOptions}
                                </select>
                            </div>
                        </div>
                    `,
                    preConfirm: () => {
                        const method = document.getElementById('checkoutMethodSelect').value;
                        const stylist = document.getElementById('checkoutStylistSelect').value;
                        const price = parseFloat(document.getElementById('checkoutPrice').value);
                        if (isNaN(price) || price <= 0) {
                            Swal.showValidationMessage('Ingresá un importe mayor a cero.');
                            return false;
                        }
                        const withItems = !!document.getElementById('checkoutItems')?.checked;
                        return { method, stylistId: stylist ? parseInt(stylist) : null, price, withItems };
                    }
                }).then(result => {
                    if (result.isConfirmed) {
                        appo.status = 'completed';
                        
                        let transactionDesc = `Venta: Turno completado (${appo.service}) para ${appo.clientName}`;
                        if (result.value.stylistId) {
                            const stylistObj = staff.find(s => s.id === result.value.stylistId);
                            if (stylistObj) {
                                const commAmt = (result.value.price * (stylistObj.commissionPct / 100)).toFixed(2);
                                transactionDesc += ` (Estilista: ${stylistObj.name} - Com: ${fmt(commAmt)})`;
                            }
                        }

                        transactions.push({
                            id: Date.now(),
                            type: 'income',
                            ts: Date.now(),
                            desc: transactionDesc,
                            item: appo.service,
                            client: appo.clientName,
                            amount: result.value.price,
                            date: getTodayStr(),
                            paymentMethod: result.value.method,
                            stylistId: result.value.stylistId,
                            ...stampStylist(result.value.stylistId)
                        });

                        let itemsTotal = 0;
                        if (result.value.withItems && appo.items && appo.items.length) {
                            appo.items.forEach((x, k) => {
                                const lp = products.find(p => p.type === 'product' && p.name === x.name);
                                if (lp) lp.stock = Math.max(0, (lp.stock || 0) - x.qty);
                                itemsTotal += x.price * x.qty;
                                transactions.push({
                                    id: Date.now() + 1 + k,
                                    type: 'income',
                                    ts: Date.now(),
                                    desc: `Venta: ${x.qty} × ${x.name} (pedido de ${appo.clientName})`,
                                    item: `${x.qty} × ${x.name}`,
                                    client: appo.clientName,
                                    amount: x.price * x.qty,
                                    date: getTodayStr(),
                                    paymentMethod: result.value.method,
                                    stylistId: null
                                });
                            });
                            appo.itemsDelivered = true;
                        }

                        saveBusinessData();
                        renderAllAppointmentsPanel(container); 
                        Swal.fire('Turno Cobrado', itemsTotal ? `Se cobraron ${fmt(result.value.price + itemsTotal)} (servicio + productos) y se descontó el stock.` : 'El estatus se actualizó a COMPLETADO y se asentó en bitácora.', 'success');
                    }
                });
            };
        }

        // Ejecución inicial en la carga del DOM
        loadBusinesses();
        document.getElementById('appRoot').innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-family:Inter,system-ui,sans-serif">Cargando…</div>';
        loadRemoteCatalog().then(function resumeAfterPublish() {
            const raw = session.get('ventiun_resume');
            if (!raw) {
                const adminEmail = session.get('ventiun_admin');
                const biz = adminEmail && businesses.find(b => b.email === adminEmail);
                if (biz) {
                    currentBusiness = biz; loadBusinessData();
                    if (biz.needsImport) { delete biz.needsImport; saveBusinesses(); importFromPublished(biz.name); }
                    cloudConnectSafe(biz);
                }
                renderApp(biz ? (store.get('ventiun_tab') || undefined) : undefined);
                if (!biz && store.get('ventiun_sup')) restoreSupport(store.get('ventiun_sup'));
                processPendingBooking();
                return captureBookingHash();
            }
            session.del('ventiun_resume');
            try {
                const r = JSON.parse(raw);
                const biz = businesses.find(b => b.email === r.email);
                if (biz) {
                    currentBusiness = biz;
                    session.set('ventiun_admin', biz.email);
                    loadBusinessData();
                    renderApp(r.tab || 'publicPage');
                    if (r.toast) {
                        Swal.fire({ title: r.toast, icon: 'success', toast: true, position: 'top-end', showConfirmButton: false, timer: 3000 });
                    } else if (r.published) {
                        Swal.fire({ title: 'Página publicada', text: 'Tus clientes ya ven los precios y horarios actualizados.', icon: 'success', toast: true, position: 'top-end', showConfirmButton: false, timer: 3000 });
                    }
                    processPendingBooking();
                    return;
                }
            } catch (e) {}
            renderApp();
        });
    </script>
</div>
<script>
// ===== Ojo para ver la contraseña que se escribe =====
(function () {
    var OPEN = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
    var SHUT = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
    function addEye(inp) {
        if (inp.dataset.eye) return;
        inp.dataset.eye = '1';
        var cs = getComputedStyle(inp);
        var wrap = document.createElement('span');
        wrap.style.position = 'relative';
        wrap.style.display = cs.display === 'inline' ? 'inline-block' : 'block';
        wrap.style.margin = cs.margin;
        if (cs.width && /swal2-input/.test(inp.className)) { wrap.style.width = cs.width; wrap.style.marginLeft = 'auto'; wrap.style.marginRight = 'auto'; }
        inp.parentNode.insertBefore(wrap, inp);
        wrap.appendChild(inp);
        inp.style.margin = '0';
        if (/swal2-input/.test(inp.className)) inp.style.width = '100%';
        inp.style.paddingRight = '44px';
        var b = document.createElement('button');
        b.type = 'button';
        b.setAttribute('aria-label', 'Mostrar contraseña');
        b.title = 'Mostrar contraseña';
        b.innerHTML = OPEN;
        b.style.cssText = 'position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;padding:6px;cursor:pointer;color:#64748b;line-height:0;display:flex;align-items:center;justify-content:center';
        b.addEventListener('mousedown', function (e) { e.preventDefault(); });
        b.addEventListener('click', function (e) {
            e.preventDefault(); e.stopPropagation();
            var show = inp.type === 'password';
            inp.type = show ? 'text' : 'password';
            b.innerHTML = show ? SHUT : OPEN;
            b.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
            b.title = b.getAttribute('aria-label');
            inp.focus();
        });
        wrap.appendChild(b);
    }
    function scan(root) {
        var list = (root || document).querySelectorAll ? (root || document).querySelectorAll('input[type="password"]:not([data-eye])') : [];
        for (var i = 0; i < list.length; i++) addEye(list[i]);
    }
    function start() {
        scan(document);
        new MutationObserver(function () { scan(document); }).observe(document.body, { childList: true, subtree: true });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
<script>
// ===== Instalar como app en el celular =====
var __installPrompt = null;
function appInstalada() {
    return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
}
function installBtnHtml() {
    if (appInstalada()) return '';
    return '<button onclick="instalarApp()" title="Instalar app en el celular" aria-label="Instalar app" class="shrink-0 text-xs font-semibold px-3 py-2 text-white bg-emerald-500 hover:bg-emerald-600 rounded-full transition shadow-sm"><i class="fas fa-download text-[10px] mr-1"></i>Instalar</button>';
}
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); __installPrompt = e; });
window.addEventListener('appinstalled', function () {
    __installPrompt = null;
    if (window.Swal) Swal.fire({ icon: 'success', title: '¡App instalada!', text: 'Ya la tenés en la pantalla de inicio de tu celular.', confirmButtonColor: '#10b981' });
});
function instalarApp() {
    if (__installPrompt) {
        __installPrompt.prompt();
        __installPrompt.userChoice.finally(function () { __installPrompt = null; });
        return;
    }
    var ua = navigator.userAgent || '';
    var ios = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var pasos = ios
        ? '<ol style="text-align:left;line-height:1.9;margin:0 auto;display:inline-block">'
          + '<li>Abrí esta página en <b>Safari</b>.</li>'
          + '<li>Tocá el botón <b>Compartir</b> (el cuadrado con la flecha hacia arriba).</li>'
          + '<li>Elegí <b>Agregar a pantalla de inicio</b>.</li>'
          + '<li>Tocá <b>Agregar</b>.</li></ol>'
        : '<ol style="text-align:left;line-height:1.9;margin:0 auto;display:inline-block">'
          + '<li>Abrí esta página en <b>Chrome</b>.</li>'
          + '<li>Tocá los <b>tres puntitos ⋮</b> arriba a la derecha.</li>'
          + '<li>Elegí <b>Instalar app</b> o <b>Agregar a pantalla principal</b>.</li>'
          + '<li>Confirmá con <b>Instalar</b>.</li></ol>';
    if (window.Swal) Swal.fire({ title: 'Instalar la app', html: pasos, icon: 'info', confirmButtonText: 'Entendido', confirmButtonColor: '#10b981' });
    else alert('Usá el menú del navegador y elegí "Agregar a pantalla de inicio".');
}
if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
