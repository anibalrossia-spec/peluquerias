        // =====================================================================
        //  PEDIDOS DE TURNO QUE LLEGAN POR WHATSAPP (link con #turno-...)
        // =====================================================================
        // ---------- Mensajes de WhatsApp para el cliente ----------
        function apptPhone(a) {
            let ph = a.clientPhone || '';
            if (!ph && a.memberNo) { const m = members.find(x => x.no === a.memberNo); if (m) ph = m.phone || ''; }
            const n = waNumber(ph);
            return n.length >= 10 ? n : '';
        }
        function apptWhen(a) {
            const d = new Date(a.dateTime);
            return `${fmtLongDate(d)} a las ${fmtTime(d)} h`;
        }
        function apptMessage(a, kind) {
            const salon = currentBusiness.name;
            const who = a.clientName.split(' ')[0];
            const prof = staff.find(x => x.id === a.stylistId);
            const addr = settings.address ? ` en ${settings.address}` : '';
            if (kind === 'confirm') return `¡Hola ${who}! Tu turno en ${salon} quedó confirmado:\n• ${a.service}\n• ${apptWhen(a)}${prof ? `\n• Te atiende ${prof.name}` : ''}\nTe esperamos${addr}. Si no podés venir, avisanos por acá.`;
            if (kind === 'remind') return `¡Hola ${who}! Te recordamos tu turno en ${salon}: ${apptWhen(a)} (${a.service}).\nTe esperamos${addr}. Si no podés venir, avisanos por acá así liberamos el horario.`;
            return `¡Hola ${who}! Te avisamos que tu turno en ${salon} del ${apptWhen(a)} (${a.service}) quedó cancelado. Si querés, te ofrecemos otro horario.`;
        }
        function waLink(phone, text) {
            return `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;
        }
        function dayOffset(iso) {
            const d = new Date(iso); d.setHours(0, 0, 0, 0);
            const t = new Date(); t.setHours(0, 0, 0, 0);
            return Math.round((d - t) / 86400000);
        }

        let syncTimer = null;
        let autoSyncFailed = false;
        // ¿La página publicada quedó desactualizada respecto del panel?
        function needsSync() {
            return !!PUBLIC_CATALOG && !autoSyncFailed && !!settings.whatsapp
                && products.some(p => p.type === 'service')
                && catalogKey(buildCatalog()) !== catalogKey(PUBLIC_CATALOG);
        }
        async function autoSync(tab, opts = {}) {
            return await publishPublicPage(await buildCatalogForPublish(), { quiet: true, tab, title: 'Actualizando la página de clientes…', toast: 'Página de clientes actualizada', ...opts });
        }
        // Republica la página para que los socios dejen de ver los horarios tomados
        function syncAvailability(toastText) {
            if (!PUBLIC_CATALOG) {
                return Swal.fire({ title: toastText, icon: 'success', toast: true, position: 'top-end', showConfirmButton: false, timer: 2000 });
            }
            clearTimeout(syncTimer);
            syncTimer = setTimeout(async () => {
                const ok = await publishPublicPage(await buildCatalogForPublish(), { quiet: true, tab: 'allApps', title: 'Actualizando horarios disponibles…', toast: toastText + ' · horarios de la página actualizados' });
                if (!ok) Swal.fire({ title: toastText, text: 'No se pudo actualizar la página de clientes. Publicala desde "Página de clientes".', icon: 'warning', toast: true, position: 'top-end', showConfirmButton: false, timer: 4000 });
            }, 400);
        }

        function captureBookingHash() {
            let h = '';
            try { h = decodeURIComponent((location.hash || '').slice(1)); } catch (e) { h = ''; }
            const m = h.match(/^turno-\d+-\d+-\d{12}-\d+$/);
            if (!m) return;
            try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
            if (currentBusiness) return processBookingToken(m[0]);
            session.set('ventiun_pending_booking', m[0]);
            Swal.fire({
                title: 'Pedido de turno',
                text: 'Ingresá al panel del local para agendar este turno. Después vas a entrar directo, sin volver a poner la contraseña.',
                icon: 'info',
                confirmButtonText: 'Ingresar',
                confirmButtonColor: '#10b981'
            }).then(() => openAuthModal('loginModal'));
        }
        function processPendingBooking() {
            const t = session.get('ventiun_pending_booking');
            if (t && currentBusiness) { session.del('ventiun_pending_booking'); processBookingToken(t); }
        }

        async function processBookingToken(token) {
            // Primero traer los turnos de la nube (por si se agendó algo desde otro celular)
            if (currentBusiness && !currentBusiness.soporte && currentBusiness.password) {
                Swal.fire({ title: 'Abriendo el pedido…', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                try { await Promise.race([cloudConnect(currentBusiness, currentBusiness.password), new Promise(r => setTimeout(r, 8000))]); } catch (e) {}
                Swal.close();
            }
            const m = token.match(/^turno-(\d+)-(\d+)-(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})-(\d+)$/);
            if (!m) return Swal.fire('Pedido no válido', 'El link del pedido está incompleto.', 'error');
            const [, si, pi, Y, Mo, D, H, Mi, no] = m;
            if (appointments.some(a => a.token === token)) {
                return Swal.fire({ title: 'Ya está en la agenda', text: 'Ese pedido ya se agendó antes.', icon: 'info', confirmButtonColor: '#10b981' });
            }
            const pubSvc = PUBLIC_CATALOG && PUBLIC_CATALOG.services[parseInt(si)];
            const svc = pubSvc ? (products.find(p => p.type === 'service' && p.name === pubSvc.name) || pubSvc) : null;
            if (!svc) return Swal.fire('Servicio no encontrado', 'El servicio del pedido ya no está en tu catálogo. Cargalo a mano con "Nuevo turno".', 'error');
            const stylistId = parseInt(pi) ? parseInt(pi) : null;
            const stylist = stylistId ? staff.find(x => x.id === stylistId) : null;
            const start = new Date(+Y, +Mo - 1, +D, +H, +Mi);
            const mem = members.find(x => x.no === parseInt(no));
            const name = mem ? mem.name : 'Socio N° ' + no;
            const phone = mem ? (mem.phone || '') : '';
            const waPhone = waNumber(phone);
            const when = `${fmtLongDate(start)} a las ${fmtTime(start)} h`;
            const err = validateSlot(svc.name, stylistId, start, settings, appointments);
            const detail = `
                <div class="text-left text-sm text-slate-600 space-y-1.5 bg-slate-50 border border-slate-200 rounded-xl p-4">
                    <div class="flex justify-between gap-3"><span>Socio</span><strong class="text-slate-800">N° ${esc(no)} – ${esc(name)}</strong></div>
                    <div class="flex justify-between gap-3"><span>Servicio</span><strong class="text-slate-800">${esc(svc.name)} · ${fmt(svc.price)}</strong></div>
                    <div class="flex justify-between gap-3"><span>Día y hora</span><strong class="text-slate-800">${esc(when)}</strong></div>
                    <div class="flex justify-between gap-3"><span>Profesional</span><strong class="text-slate-800">${stylist ? esc(stylist.name) : 'Sin preferencia'}</strong></div>
                </div>`;
            if (!mem) {
                // Socio inexistente o eliminado: igual se muestra, pero avisando
            }
            if (err) {
                const busyMsg = `¡Hola ${name}! El horario que pediste en ${currentBusiness.name} (${when}) ya está ocupado. ¿Te sirve otro horario?`;
                return Swal.fire({
                    title: 'No se puede agendar',
                    icon: 'warning',
                    confirmButtonColor: '#0f172a',
                    html: detail + `<p class="mt-4 text-sm text-rose-600">${esc(err)}</p>` +
                        (waPhone.length >= 10 ? `<a href="https://wa.me/${waPhone}?text=${encodeURIComponent(busyMsg)}" target="_blank" rel="noopener" class="mt-4 inline-flex items-center gap-2 text-sm font-bold text-emerald-600 hover:underline"><i class="fab fa-whatsapp"></i> Avisarle y ofrecer otro horario</a>` : '')
                });
            }
            const r = await Swal.fire({
                title: 'Agendar pedido de turno',
                html: detail + (mem ? '' : '<p class="mt-3 text-xs text-amber-700">Ese número de socio no está en tu lista. Revisalo antes de agendar.</p>'),
                showCancelButton: true,
                confirmButtonText: 'Agendar turno',
                cancelButtonText: 'Ahora no',
                confirmButtonColor: '#10b981'
            });
            if (!r.isConfirmed) return;
            appointments.push({
                id: 'app_' + Date.now(),
                token,
                clientName: name,
                clientPhone: phone,
                clientEmail: '',
                memberNo: parseInt(no),
                service: svc.name,
                price: svc.price,
                dateTime: start.toISOString(),
                stylistId,
                status: 'scheduled',
                source: 'web'
            });
            saveBusinessData();
            renderApp('allApps');
            const newAppo = appointments[appointments.length - 1];
            const okMsg = apptMessage(newAppo, 'confirm');
            await Swal.fire({
                title: 'Turno agendado',
                icon: 'success',
                confirmButtonText: 'Listo',
                confirmButtonColor: '#10b981',
                html: `<p class="text-sm text-slate-600">${esc(name)} · ${esc(when)}</p>` +
                    (waPhone.length >= 10 ? `<a id="webConfirmLink" href="https://wa.me/${waPhone}?text=${encodeURIComponent(okMsg)}" target="_blank" rel="noopener" class="mt-4 inline-flex items-center gap-2 text-sm font-bold text-emerald-600 hover:underline"><i class="fab fa-whatsapp"></i> Confirmarle por WhatsApp</a>` : '<p class="mt-3 text-xs text-slate-400">Confirmale por WhatsApp desde el chat donde te llegó el pedido.</p>'),
                didOpen: () => document.getElementById('webConfirmLink')?.addEventListener('click', () => { newAppo.confirmedAt = new Date().toISOString(); saveBusinessData(); })
            });
            syncAvailability('Turno agendado');
        }

        // ---------- Alta manual de turnos (pedidos por WhatsApp) ----------
        function openNewAppointmentModal(container) {
            const services = products.filter(p => p.type === 'service');
            if (!services.length) return Swal.fire('Sin servicios', 'Agregá al menos un servicio en Inventario.', 'warning');
            const inputCls = 'w-full border border-slate-200 rounded-xl p-2.5 text-sm';
            Swal.fire({
                title: 'Nuevo turno',
                showCancelButton: true,
                confirmButtonText: 'Agendar',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#10b981',
                html: `
                    <div class="text-left space-y-3 mt-2">
                        ${members.length ? `<div><label for="naMember" class="block text-xs font-bold text-slate-500 mb-1">SOCIO</label><select id="naMember" class="${inputCls}"><option value="">Sin socio / cliente nuevo</option>${members.filter(m => m.active).map(m => `<option value="${m.id}">N° ${m.no} – ${esc(m.name)}</option>`).join('')}</select></div>` : ''}
                        <div><label for="naName" class="block text-xs font-bold text-slate-500 mb-1">CLIENTE</label><input id="naName" class="${inputCls}" placeholder="Nombre y apellido"></div>
                        <div><label for="naPhone" class="block text-xs font-bold text-slate-500 mb-1">TELÉFONO (OPCIONAL)</label><input id="naPhone" type="tel" class="${inputCls}" placeholder="11 2345 6789"></div>
                        <div><label for="naService" class="block text-xs font-bold text-slate-500 mb-1">SERVICIO</label><select id="naService" class="${inputCls}">${services.map(s => `<option value="${esc(s.name)}">${esc(s.name)} · ${fmt(s.price)} · ${s.duration || DEFAULT_DURATION} min</option>`).join('')}</select></div>
                        <div><label for="naStylist" class="block text-xs font-bold text-slate-500 mb-1">PROFESIONAL</label><select id="naStylist" class="${inputCls}"><option value="">Sin asignar</option>${staff.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></div>
                        <div><label for="naDate" class="block text-xs font-bold text-slate-500 mb-1">DÍA Y HORA</label><input id="naDate" type="datetime-local" step="1800" class="${inputCls}"></div>
                    </div>`,
                didOpen: () => {
                    document.getElementById('naMember')?.addEventListener('change', e => {
                        const m = members.find(x => String(x.id) === e.target.value);
                        if (m) { document.getElementById('naName').value = m.name; document.getElementById('naPhone').value = m.phone || ''; }
                    });
                },
                preConfirm: () => {
                    const name = document.getElementById('naName').value.trim();
                    const phone = document.getElementById('naPhone').value.trim();
                    const service = document.getElementById('naService').value;
                    const sv = document.getElementById('naStylist').value;
                    const dt = document.getElementById('naDate').value;
                    if (!name) { Swal.showValidationMessage('Ingresá el nombre del cliente.'); return false; }
                    if (!dt) { Swal.showValidationMessage('Elegí día y hora.'); return false; }
                    const start = new Date(dt);
                    const stylistId = sv ? parseInt(sv) : null;
                    const err = validateSlot(service, stylistId, start, settings, appointments);
                    if (err) { Swal.showValidationMessage(err); return false; }
                    return { name, phone, service, stylistId, start };
                }
            }).then(res => {
                if (!res.isConfirmed) return;
                const v = res.value;
                const svc = products.find(p => p.type === 'service' && p.name === v.service);
                appointments.push({
                    id: 'app_' + Date.now(),
                    clientName: v.name,
                    clientPhone: v.phone,
                    clientEmail: '',
                    service: v.service,
                    price: svc ? svc.price : null,
                    dateTime: v.start.toISOString(),
                    stylistId: v.stylistId,
                    status: 'scheduled',
                    source: 'whatsapp'
                });
                saveBusinessData();
                renderAllAppointmentsPanel(container);
                const newAppo = appointments[appointments.length - 1];
                const ph = apptPhone(newAppo);
                Swal.fire({
                    title: 'Turno agendado',
                    icon: 'success',
                    confirmButtonText: 'Listo',
                    confirmButtonColor: '#10b981',
                    html: `<p class="text-sm text-slate-600">${esc(newAppo.clientName)} · ${esc(apptWhen(newAppo))}</p>` + (ph
                        ? `<a id="naConfirmLink" href="${waLink(ph, apptMessage(newAppo, 'confirm'))}" target="_blank" rel="noopener" class="mt-4 inline-flex items-center gap-2 text-sm font-bold text-emerald-600 hover:underline"><i class="fab fa-whatsapp"></i> Confirmarle por WhatsApp</a>`
                        : '<p class="mt-3 text-xs text-slate-400">Sin WhatsApp cargado: podés agregarlo desde la Agenda.</p>'),
                    didOpen: () => document.getElementById('naConfirmLink')?.addEventListener('click', () => { newAppo.confirmedAt = new Date().toISOString(); saveBusinessData(); })
                }).then(() => syncAvailability('Turno agendado'));
            });
        }

        function renderAllAppointmentsPanel(container) {
            container.innerHTML = `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200/60 p-6">
                    <div class="flex flex-wrap items-start justify-between gap-3 mb-5">
                        <div>
                            <h2 class="text-lg font-bold text-slate-800 mb-1">🗓️ Agenda Central de Turnos</h2>
                            <p class="text-xs text-slate-400">Cargá acá los turnos que te piden por WhatsApp y cobralos cuando se atienden.</p>
                        </div>
                        <div class="flex flex-wrap gap-2">
                            <button id="loadRequestBtn" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-4 py-2.5 rounded-xl text-xs transition shadow-sm">
                                <i class="fab fa-whatsapp mr-1"></i> Cargar pedido de WhatsApp
                            </button>
                            <button id="newAppBtn" class="bg-slate-900 hover:bg-slate-800 text-white font-bold px-4 py-2.5 rounded-xl text-xs transition shadow-sm">
                                <i class="fas fa-plus mr-1"></i> Nuevo turno
                            </button>
                        </div>
                    </div>
                    
                    <div class="overflow-x-auto scrollbar-thin">
                        <table class="min-w-full text-sm">
                            <thead class="bg-slate-50 border-b border-slate-100">
                                <tr class="text-slate-400 font-semibold text-xs">
                                    <th class="p-3.5 text-left">Cliente</th>
                                    <th class="p-3.5 text-left">Tratamiento / Servicio</th>
                                    <th class="p-3.5 text-left">Profesional Asignado</th>
                                    <th class="p-3.5 text-left">Fecha y Hora Programada</th>
                                    <th class="p-3.5 text-left">Estado</th>
                                    <th class="p-3.5 text-left">Acción Administrativa</th>
                                </tr>
                            </thead>
                            <tbody id="allAppsTableBody" class="divide-y divide-slate-100">
                                <!-- Poblado dinámicamente -->
                            </tbody>
                        </table>
                    </div>
                </div>
            `;

            document.getElementById('newAppBtn')?.addEventListener('click', () => openNewAppointmentModal(container));
            const tableWrap = document.getElementById('allAppsTableBody')?.closest('.overflow-x-auto');
            if (tableWrap && !document.getElementById('remindersBox')) { const rb = document.createElement('div'); rb.id = 'remindersBox'; tableWrap.before(rb); }
            document.getElementById('loadRequestBtn')?.addEventListener('click', async () => {
                const r = await Swal.fire({
                    title: 'Cargar pedido de WhatsApp',
                    html: '<p class="text-sm text-slate-500 mb-3">Pegá el mensaje completo que te mandó el socio.</p><textarea id="reqPaste" rows="7" class="w-full border border-slate-200 rounded-xl p-3 text-xs" placeholder="¡Hola! Quiero pedir un turno…"></textarea>',
                    showCancelButton: true,
                    confirmButtonText: 'Leer pedido',
                    cancelButtonText: 'Cancelar',
                    confirmButtonColor: '#10b981',
                    preConfirm: () => {
                        const m = document.getElementById('reqPaste').value.match(/turno-\d+-\d+-\d{12}-\d+/);
                        if (!m) { Swal.showValidationMessage('No encontré el código del turno. Copiá el mensaje entero, incluida la línea "Para agendarlo".'); return false; }
                        return m[0];
                    }
                });
                if (r.isConfirmed) processBookingToken(r.value);
            });

            const tbody = document.getElementById('allAppsTableBody');
            if (!tbody) return;

            if (appointments.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-10 text-slate-400 text-xs">No hay reservas vigentes agendadas en la central.</td></tr>`;
                return;
            }

            const sortedApps = [...appointments].sort((a, b) => new Date(a.dateTime) - new Date(b.dateTime));

            tbody.innerHTML = sortedApps.map(a => {
                const professional = staff.find(s => s.id === a.stylistId);
                const isCompleted = a.status === 'completed';

                return `
                    <tr class="hover:bg-slate-50/50 transition">
                        <td class="p-3.5">
                            <span class="font-bold text-slate-800 block">${esc(a.clientName)}</span>
                            <span class="text-[10px] text-slate-400 block">${a.memberNo ? 'Socio N° ' + a.memberNo + (a.clientPhone ? ' · ' : '') : ''}${esc(a.clientPhone || a.clientEmail || '')}</span>
                        </td>
                        <td class="p-3.5 font-semibold text-slate-700">${esc(a.service)}</td>
                        <td class="p-3.5 text-slate-500">${professional ? esc(professional.name) : '—'}</td>
                        <td class="p-3.5 text-slate-600 font-semibold">${fmtDateTime(a.dateTime)}</td>
                        <td class="p-3.5">
                            <span class="text-[9px] font-bold px-2.5 py-1 rounded-full border ${isCompleted ? 'bg-emerald-50 text-emerald-600 border-emerald-100' : 'bg-blue-50 text-blue-600 border-blue-100'} uppercase">
                                ${isCompleted ? 'Completado' : 'Pendiente'}
                            </span>
                        </td>
                        <td class="p-3.5">
                            ${!isCompleted ? `
                                <div class="flex flex-wrap items-center gap-1 mb-1.5">
                                    ${apptPhone(a) ? `
                                        <a data-wa="confirm" data-id="${a.id}" href="${waLink(apptPhone(a), apptMessage(a, 'confirm'))}" target="_blank" rel="noopener" class="font-semibold px-3 py-1.5 rounded-xl text-xs transition ${a.confirmedAt ? 'text-slate-500 hover:bg-slate-100' : 'bg-emerald-50 text-emerald-700 hover:bg-emerald-100 border border-emerald-200'}"><i class="fab fa-whatsapp mr-1"></i>${a.confirmedAt ? 'Confirmado ✓' : 'Confirmar'}</a>
                                        ${dayOffset(a.dateTime) >= 0 ? `<a data-wa="remind" data-id="${a.id}" href="${waLink(apptPhone(a), apptMessage(a, 'remind'))}" target="_blank" rel="noopener" class="font-semibold px-3 py-1.5 rounded-xl text-xs transition ${a.remindedAt ? 'text-slate-500 hover:bg-slate-100' : (dayOffset(a.dateTime) <= 1 ? 'bg-amber-50 text-amber-800 hover:bg-amber-100 border border-amber-200' : 'text-slate-600 hover:bg-slate-100')}"><i class="far fa-bell mr-1"></i>${a.remindedAt ? 'Recordado ✓' : 'Recordatorio'}</a>` : ''}
                                    ` : `<button onclick="window.addPhoneAppt('${a.id}')" class="text-xs font-semibold text-slate-500 hover:bg-slate-100 px-3 py-1.5 rounded-xl"><i class="fab fa-whatsapp mr-1"></i>Cargar WhatsApp</button>`}
                                </div>
                                <div class="flex flex-wrap items-center gap-1">
                                    <button onclick="window.checkoutAppointment('${a.id}')" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-3 py-1.5 rounded-xl text-xs transition shadow-sm">
                                        💳 Cobrar en Caja
                                    </button>
                                    <button onclick="window.cancelAppointmentAdmin('${a.id}')" class="text-rose-600 hover:bg-rose-50 font-semibold px-3 py-1.5 rounded-xl text-xs transition">Cancelar</button>
                                </div>
                            ` : `
                                <span class="text-xs text-slate-400 font-medium">Facturado</span>
                            `}
                        </td>
                    </tr>
                `;
            }).join('');

            // Marcar como enviado al tocar Confirmar / Recordatorio
            tbody.querySelectorAll('a[data-wa]').forEach(link => link.addEventListener('click', () => {
                const appo = appointments.find(a => a.id === link.dataset.id);
                if (!appo) return;
                if (link.dataset.wa === 'confirm') appo.confirmedAt = new Date().toISOString();
                else appo.remindedAt = new Date().toISOString();
                saveBusinessData();
                setTimeout(() => renderAllAppointmentsPanel(container), 400);
            }));

            const dueReminders = appointments.filter(a => a.status !== 'completed' && !a.remindedAt && apptPhone(a) && [0, 1].includes(dayOffset(a.dateTime)) && new Date(a.dateTime) > new Date());
            const remBox = document.getElementById('remindersBox');
            if (remBox && dueReminders.length) {
                remBox.innerHTML = `<div class="mb-4 flex flex-wrap items-center gap-2 p-3.5 rounded-xl bg-amber-50 border border-amber-200 text-xs text-amber-900"><i class="far fa-bell"></i><span><strong>${dueReminders.length === 1 ? '1 turno de hoy o mañana' : dueReminders.length + ' turnos de hoy o mañana'}</strong> sin recordatorio. Tocá "Recordatorio" en cada uno para avisarle por WhatsApp.</span></div>`;
            }

            window.addPhoneAppt = async (appointmentId) => {
                const appo = appointments.find(a => a.id === appointmentId);
                if (!appo) return;
                const r = await Swal.fire({
                    title: 'WhatsApp del cliente',
                    html: `<p class="text-sm text-slate-500 mb-3">${esc(appo.clientName)}</p><input id="apPhone" type="tel" class="w-full border border-slate-200 rounded-xl p-3 text-sm" placeholder="3415551111">`,
                    showCancelButton: true, confirmButtonText: 'Guardar', cancelButtonText: 'Cancelar', confirmButtonColor: '#10b981',
                    preConfirm: () => {
                        const v = document.getElementById('apPhone').value.trim();
                        if (waNumber(v).length < 10) { Swal.showValidationMessage('Ingresá el número con característica, por ejemplo 3415551111.'); return false; }
                        return v;
                    }
                });
                if (!r.isConfirmed) return;
                appo.clientPhone = r.value;
                const mem = appo.memberNo && members.find(x => x.no === appo.memberNo);
                if (mem && !mem.phone) mem.phone = r.value;
                saveBusinessData();
                renderAllAppointmentsPanel(container);
            };

            window.cancelAppointmentAdmin = async (appointmentId) => {
                const appo = appointments.find(a => a.id === appointmentId);
                if (!appo) return;
                const r = await Swal.fire({ title: '¿Cancelar este turno?', text: `${appo.clientName} · ${fmtDateTime(appo.dateTime)}. El horario vuelve a quedar libre para los socios.`, showCancelButton: true, confirmButtonText: 'Cancelar turno', cancelButtonText: 'Volver', confirmButtonColor: '#e11d48' });
                if (!r.isConfirmed) return;
                appointments = appointments.filter(a => a.id !== appointmentId);
                saveBusinessData();
                renderAllAppointmentsPanel(container);
                const ph = apptPhone(appo);
                if (ph) {
                    await Swal.fire({
                        title: 'Turno cancelado',
                        icon: 'success',
                        confirmButtonText: 'Listo',
                        confirmButtonColor: '#10b981',
                        html: `<a href="${waLink(ph, apptMessage(appo, 'cancel'))}" target="_blank" rel="noopener" class="inline-flex items-center gap-2 text-sm font-bold text-emerald-600 hover:underline"><i class="fab fa-whatsapp"></i> Avisarle por WhatsApp</a>`
                    });
                }
                syncAvailability('Turno cancelado y horario liberado');
            };

            window.checkoutAppointment = (appointmentId) => {
                if (!cashOpen) {
                    return Swal.fire('Caja Cerrada', 'Es necesario abrir el turno de caja antes de cobrar turnos.', 'warning');
                }

                const appo = appointments.find(a => a.id === appointmentId);
                if (!appo) return;

                const matchingService = products.find(p => p.name === appo.service);
                const defaultPrice = matchingService ? matchingService.price : (appo.price ?? '');

                let stylistOptions = '<option value="">Ninguno / Venta directa</option>';
                staff.forEach(member => {
                    const isSelected = member.id === appo.stylistId ? 'selected' : '';
                    stylistOptions += `<option value="${member.id}" ${isSelected}>${esc(member.name)} (${esc(member.role)})</option>`;
                });

                Swal.fire({
                    title: 'Cobrar turno',
                    text: `Checkout rápido para el turno de ${appo.clientName}`,
                    icon: 'info',
                    showCancelButton: true,
                    confirmButtonColor: '#10b981',
                    confirmButtonText: 'Registrar Cobro',
                    html: `
                        <div class="text-left mt-3 space-y-3">
                            <div>
                                <label class="block text-xs font-bold text-slate-500 mb-1">SERVICIO A COBRAR</label>
                                <input class="swal2-input !w-full !m-0" value="${esc(appo.service)}" disabled>
                            </div>
                            <div>
                                <label for="checkoutPrice" class="block text-xs font-bold text-slate-500 mb-1">IMPORTE A COBRAR ($)</label>
                                <input id="checkoutPrice" type="number" step="0.01" min="0" class="swal2-input !w-full !m-0" value="${defaultPrice}">
                                ${matchingService ? '' : '<p class="text-[11px] text-amber-600 mt-1">Este servicio ya no está en el catálogo. Revisá el importe.</p>'}
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 mb-1">MÉTODO DE PAGO</label>
                                <select id="checkoutMethodSelect" class="swal2-select w-full border rounded-xl p-2.5 text-sm focus:outline-none">
                                    <option value="efectivo">💵 Efectivo</option>
                                    <option value="tarjeta">💳 Tarjeta (Débito / Crédito)</option>
                                    <option value="transferencia">🏦 Transferencia Bancaria</option>
                                    <option value="otros">📱 Pago Móvil / Otros</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 mb-1">ASIGNAR PROFESIONAL (LIQUIDA COMISIÓN)</label>
                                <select id="checkoutStylistSelect" class="swal2-select w-full border rounded-xl p-2.5 text-sm focus:outline-none">
                                    ${stylistOptions}
                                </select>
                            </div>
                        </div>
                    `,
                    preConfirm: () => {
                        const method = document.getElementById('checkoutMethodSelect').value;
                        const stylist = document.getElementById('checkoutStylistSelect').value;
                        const price = parseFloat(document.getElementById('checkoutPrice').value);
                        if (isNaN(price) || price <= 0) {
                            Swal.showValidationMessage('Ingresá un importe mayor a cero.');
                            return false;
                        }
                        return { method, stylistId: stylist ? parseInt(stylist) : null, price };
                    }
                }).then(result => {
                    if (result.isConfirmed) {
                        appo.status = 'completed';
                        
                        let transactionDesc = `Venta: Turno completado (${appo.service}) para ${appo.clientName}`;
                        if (result.value.stylistId) {
                            const stylistObj = staff.find(s => s.id === result.value.stylistId);
                            if (stylistObj) {
                                const commAmt = (result.value.price * (stylistObj.commissionPct / 100)).toFixed(2);
                                transactionDesc += ` (Estilista: ${stylistObj.name} - Com: ${fmt(commAmt)})`;
                            }
                        }

                        transactions.push({
                            id: Date.now(),
                            type: 'income',
                            desc: transactionDesc,
                            amount: result.value.price,
                            date: getTodayStr(),
                            paymentMethod: result.value.method,
                            stylistId: result.value.stylistId
                        });

                        saveBusinessData();
                        renderAllAppointmentsPanel(container); 
                        Swal.fire('Turno Cobrado', 'El estatus se actualizó a COMPLETADO y se asentó en bitácora.', 'success');
                    }
                });
            };
        }

        // Ejecución inicial en la carga del DOM
        loadBusinesses();
        document.getElementById('appRoot').innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-family:Inter,system-ui,sans-serif">Cargando…</div>';
        loadRemoteCatalog().then(function resumeAfterPublish() {
            const raw = session.get('ventiun_resume');
            if (!raw) {
                const adminEmail = session.get('ventiun_admin');
                const biz = adminEmail && businesses.find(b => b.email === adminEmail);
                if (biz) {
                    currentBusiness = biz; loadBusinessData();
                    if (biz.needsImport) { delete biz.needsImport; saveBusinesses(); importFromPublished(biz.name); }
                    cloudConnectSafe(biz);
                }
                renderApp();
                processPendingBooking();
                return captureBookingHash();
            }
            session.del('ventiun_resume');
            try {
                const r = JSON.parse(raw);
                const biz = businesses.find(b => b.email === r.email);
                if (biz) {
                    currentBusiness = biz;
                    session.set('ventiun_admin', biz.email);
                    loadBusinessData();
                    renderApp(r.tab || 'publicPage');
                    if (r.toast) {
                        Swal.fire({ title: r.toast, icon: 'success', toast: true, position: 'top-end', showConfirmButton: false, timer: 3000 });
                    } else if (r.published) {
                        Swal.fire({ title: 'Página publicada', text: 'Tus clientes ya ven los precios y horarios actualizados.', icon: 'success', toast: true, position: 'top-end', showConfirmButton: false, timer: 3000 });
                    }
                    processPendingBooking();
                    return;
                }
            } catch (e) {}
            renderApp();
        });
    </script>
</div>
<script>
// ===== Ojo para ver la contraseña que se escribe =====
(function () {
    var OPEN = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
    var SHUT = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
    function addEye(inp) {
        if (inp.dataset.eye) return;
        inp.dataset.eye = '1';
        var cs = getComputedStyle(inp);
        var wrap = document.createElement('span');
        wrap.style.position = 'relative';
        wrap.style.display = cs.display === 'inline' ? 'inline-block' : 'block';
        wrap.style.margin = cs.margin;
        if (cs.width && /swal2-input/.test(inp.className)) { wrap.style.width = cs.width; wrap.style.marginLeft = 'auto'; wrap.style.marginRight = 'auto'; }
        inp.parentNode.insertBefore(wrap, inp);
        wrap.appendChild(inp);
        inp.style.margin = '0';
        if (/swal2-input/.test(inp.className)) inp.style.width = '100%';
        inp.style.paddingRight = '44px';
        var b = document.createElement('button');
        b.type = 'button';
        b.setAttribute('aria-label', 'Mostrar contraseña');
        b.title = 'Mostrar contraseña';
        b.innerHTML = OPEN;
        b.style.cssText = 'position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;padding:6px;cursor:pointer;color:#64748b;line-height:0;display:flex;align-items:center;justify-content:center';
        b.addEventListener('mousedown', function (e) { e.preventDefault(); });
        b.addEventListener('click', function (e) {
            e.preventDefault(); e.stopPropagation();
            var show = inp.type === 'password';
            inp.type = show ? 'text' : 'password';
            b.innerHTML = show ? SHUT : OPEN;
            b.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
            b.title = b.getAttribute('aria-label');
            inp.focus();
        });
        wrap.appendChild(b);
    }
    function scan(root) {
        var list = (root || document).querySelectorAll ? (root || document).querySelectorAll('input[type="password"]:not([data-eye])') : [];
        for (var i = 0; i < list.length; i++) addEye(list[i]);
    }
    function start() {
        scan(document);
        new MutationObserver(function () { scan(document); }).observe(document.body, { childList: true, subtree: true });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
<script>
// ===== Instalar como app en el celular =====
var __installPrompt = null;
function appInstalada() {
    return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
}
function installBtnHtml() {
    if (appInstalada()) return '';
    return '<button onclick="instalarApp()" title="Instalar app en el celular" aria-label="Instalar app" class="shrink-0 text-xs font-semibold px-3 py-2 text-white bg-emerald-500 hover:bg-emerald-600 rounded-full transition shadow-sm"><i class="fas fa-download text-[10px] mr-1"></i>Instalar</button>';
}
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); __installPrompt = e; });
window.addEventListener('appinstalled', function () {
    __installPrompt = null;
    if (window.Swal) Swal.fire({ icon: 'success', title: '¡App instalada!', text: 'Ya la tenés en la pantalla de inicio de tu celular.', confirmButtonColor: '#10b981' });
});
function instalarApp() {
    if (__installPrompt) {
        __installPrompt.prompt();
        __installPrompt.userChoice.finally(function () { __installPrompt = null; });
        return;
    }
    var ua = navigator.userAgent || '';
    var ios = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var pasos = ios
        ? '<ol style="text-align:left;line-height:1.9;margin:0 auto;display:inline-block">'
          + '<li>Abrí esta página en <b>Safari</b>.</li>'
          + '<li>Tocá el botón <b>Compartir</b> (el cuadrado con la flecha hacia arriba).</li>'
          + '<li>Elegí <b>Agregar a pantalla de inicio</b>.</li>'
          + '<li>Tocá <b>Agregar</b>.</li></ol>'
        : '<ol style="text-align:left;line-height:1.9;margin:0 auto;display:inline-block">'
          + '<li>Abrí esta página en <b>Chrome</b>.</li>'
          + '<li>Tocá los <b>tres puntitos ⋮</b> arriba a la derecha.</li>'
          + '<li>Elegí <b>Instalar app</b> o <b>Agregar a pantalla principal</b>.</li>'
          + '<li>Confirmá con <b>Instalar</b>.</li></ol>';
    if (window.Swal) Swal.fire({ title: 'Instalar la app', html: pasos, icon: 'info', confirmButtonText: 'Entendido', confirmButtonColor: '#10b981' });
    else alert('Usá el menú del navegador y elegí "Agregar a pantalla de inicio".');
}
if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
