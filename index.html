        // Modelos de datos globales con persistencia

        // Variables operativas del negocio activo
        let products = [];         // { id, name, price, stock, type: 'product'|'service' }

        let appointments = [];     // { id, clientEmail, clientName, service, dateTime, stylistId, status: 'scheduled'|'completed' }
        let staff = [];            // { id, name, role, commissionPct }
        let cashOpen = false;

        let members = [];          // socios: { id, no, name, phone, code, active, createdAt }
        const DEFAULT_SETTINGS = { whatsapp: '', address: '', openMin: 540, closeMin: 1200, days: [1, 2, 3, 4, 5, 6], note: '', pageLink: '', codeSalt: '', membersRev: 0, nextMemberNo: 1 };
        let settings = { ...DEFAULT_SETTINGS };   // datos de la página de clientes
        let publicMeta = { publishedAt: null };    // última publicación hecha desde este navegador
        let publicPreview = false;                 // dueño viendo la página de clientes

        // Catálogo publicado (viene incrustado en la página)
        let PUBLIC_CATALOG = null;
        try { PUBLIC_CATALOG = JSON.parse(document.getElementById('publicCatalog').textContent); } catch (e) { PUBLIC_CATALOG = null; }
        let showAdminLanding = false;
        let clientView = null;   // { cat, local, member } cuando un socio entró a pedir turno
        const store = {
            get(k){ try { return window.localStorage.getItem(k); } catch(e){ return null; } },
            set(k,v){ try { window.localStorage.setItem(k,v); } catch(e){} },
            del(k){ try { window.localStorage.removeItem(k); } catch(e){} }
        };
        // ---------- Fondo blanco / negro (se recuerda en este dispositivo) ----------
        function applyTheme() {
            document.documentElement.classList.toggle('vg-dark', store.get('ventiun_theme') === 'dark');

        function toggleTheme() {
            store.set('ventiun_theme', document.documentElement.classList.contains('vg-dark') ? 'light' : 'dark');
            applyTheme();
        }
        function themeBtnHtml(extra = '') {
            return `<button type="button" onclick="toggleTheme()" title="Cambiar a fondo blanco o negro" aria-label="Cambiar a fondo blanco o negro" class="shrink-0 w-9 h-9 inline-flex items-center justify-center rounded-full border border-slate-200 text-slate-500 hover:text-slate-800 hover:bg-slate-100 transition ${extra}"><span class="theme-icon-moon"><i class="fas fa-moon"></i></span><span class="theme-icon-sun"><i class="fas fa-sun"></i></span></button>`;
        }
        applyTheme();

        // La sesión del dueño queda guardada en su celular (hasta "Cerrar sistema"), así los links de turnos abren directo el panel
        const KEEP_KEYS = { ventiun_admin: 1, ventiun_pending_booking: 1 };
        const session = {
            get(k){ try { const v = window.sessionStorage.getItem(k); if (v != null || !KEEP_KEYS[k]) return v; return window.localStorage.getItem(k + '_keep'); } catch(e){ return null; } },
            set(k,v){ try { window.sessionStorage.setItem(k,v); if (KEEP_KEYS[k]) window.localStorage.setItem(k + '_keep', v); } catch(e){} },
            del(k){ try { window.sessionStorage.removeItem(k); if (KEEP_KEYS[k]) window.localStorage.removeItem(k + '_keep'); } catch(e){} }
        };

        function saveBusinesses() {
            store.set('ventiun_businesses_v2', JSON.stringify(businesses));
        }

        function loadBusinesses() {
            const stored = store.get('ventiun_businesses_v2');
            try { businesses = stored ? JSON.parse(stored) : []; } catch(e) { businesses = []; }
        }

        function saveBusinessData() {
            if (!currentBusiness) return;
            const key = `ventiun_v2_data_${currentBusiness.email}`;
            const payload = { products, transactions, appointments, staff, cashOpen, cashClosures, settings, publicMeta, members };
            store.set(key, JSON.stringify(payload));
            if (!cloudApplying) { store.set('ventiun_v2_ts_' + currentBusiness.email, String(Date.now() - (store.get('ventiun_v2_seed_' + currentBusiness.email) ? SEED_AGE : 0))); cloudQueue(); }
        }

        function loadBusinessData() {
            if (!currentBusiness) return;
            const key = `ventiun_v2_data_${currentBusiness.email}`;
            const stored = store.get(key);
            if (stored) {
                try {
                    const data = JSON.parse(stored);
                    products = data.products || [];
                    transactions = data.transactions || [];
                    appointments = data.appointments || [];
                    staff = data.staff || [];
                    cashOpen = data.cashOpen || false;
                    cashClosures = data.cashClosures || [];
                    settings = { ...DEFAULT_SETTINGS, ...(data.settings || {}) };
                    publicMeta = data.publicMeta || { publishedAt: null };
                    members = data.members || [];
                } catch (e) {
                    console.error("Error parsing business data, loading defaults.");
                    loadDefaultBusinessData();
                }
            } else {
                loadDefaultBusinessData();
            }
        }

        function loadDefaultBusinessData() {
            // Un local nuevo arranca sin datos: el dueño carga sus servicios, productos y equipo
            products = [];
            staff = [];
            appointments = [];
            transactions = [];
            members = [];

            cashOpen = false;
            cashClosures = [];
            settings = { ...DEFAULT_SETTINGS };
            publicMeta = { publishedAt: null };
            saveBusinessData();
        }

        // Helpers temporales y financieros
        function toLocalDateStr(d) {
            const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
            return z.toISOString().slice(0, 10);
        }
        function getTodayStr() {
            return toLocalDateStr(new Date());
        }

        // Formato de moneda argentina: $12.500 / $1.234,50
        function fmt(n) {
            const v = Number(n) || 0;
            return '$' + v.toLocaleString('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
        }

        // Escapa texto antes de insertarlo en HTML
        function esc(str) {
            return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        // Horario del local y duración de servicios
        const DEFAULT_DURATION = 30;
        const SLOT_STEP = 30; // los turnos se ofrecen cada 30 minutos
        const DAY_SHORT = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
        const DAY_LONG = ['domingos', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábados'];
        function getServiceDuration(serviceName) {
            const svc = products.find(p => p.type === 'service' && p.name === serviceName)
                || (PUBLIC_CATALOG && PUBLIC_CATALOG.services.find(p => p.name === serviceName));
            return (svc && svc.duration) ? svc.duration : DEFAULT_DURATION;
        }
        // Número para wa.me: agrega 54 y el 9 de celular si faltan (Argentina)
        function waNumber(n) {
            let d = String(n || '').replace(/\D/g, '');
            if (d.startsWith('00')) d = d.slice(2);
            if (d.length === 10) return '549' + d;              // 3415628884 -> 5493415628884
            if (d.length === 12 && d.startsWith('54') && d[2] !== '9') return '549' + d.slice(2);
            return d;
        }
        function minToHHMM(m) {
            return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
        }
        function hhmmToMin(v) {
            const [h, m] = String(v || '').split(':').map(Number);
            return (isNaN(h) || isNaN(m)) ? null : h * 60 + m;
        }
        // "Lun a Sáb" o "Lun, Mié, Vie"
        function fmtDays(days) {
            const order = [1, 2, 3, 4, 5, 6, 0].filter(d => days.includes(d));
            if (!order.length) return 'Sin días de atención';
            const idx = order.map(d => (d + 6) % 7);
            const consecutive = idx.every((v, i) => i === 0 || v === idx[i - 1] + 1);
            if (consecutive && order.length > 2) return `${DAY_SHORT[order[0]]} a ${DAY_SHORT[order[order.length - 1]]}`;
            return order.map(d => DAY_SHORT[d]).join(', ');
        }
        function fmtLongDate(d) {
            const wd = d.toLocaleDateString('es-AR', { weekday: 'long' });
            return wd.charAt(0).toUpperCase() + wd.slice(1) + ' ' + d.getDate() + '/' + (d.getMonth() + 1);
        }
        // Devuelve un texto de error o null si el horario es válido
        const DEFAULT_PAGE_LINK = 'https://anibalrossia-spec.github.io/peluquerias/';
        // ---- Varias peluquerías: cada una con su enlace y sus datos ----
        function slugOf(n) { return String(n || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'local'; }
        function pageLinkFor(slug) { return slug === 'phatto' ? DEFAULT_PAGE_LINK : DEFAULT_PAGE_LINK + '?l=' + slug; }
        function bizSlug(b) { return b && b.portalId ? String(b.portalId).replace(/^p-/, '') : slugOf(b && b.name); }
        function bizPortalId(b) { return 'p-' + bizSlug(b); }
        function bizLink() {
            const l = settings.pageLink || '';
            return (!l || /claude\.ai/.test(l) || l.replace(/\/+$/, '') === DEFAULT_PAGE_LINK.replace(/\/+$/, '')) ? pageLinkFor(bizSlug(currentBusiness)) : l;
        }
        // Si el local no es el de esta página, abre la página del local (la sesión sigue abierta)
        function goToOwnPage(biz) {
            const s = bizSlug(biz);
            if (s === window.VENTIUN_PORTAL_SLUG) return false;
            location.href = location.pathname + (s === 'phatto' ? '' : '?l=' + s);
            return true;
        }

        // Bloques ocupados de la agenda, en minutos desde 1970: { s, e, p (profesional o null) }
        function agendaBlocks(apps, excludeId) {
            return (apps || []).filter(a => a.status !== 'cancelled' && a.id !== excludeId).map(a => {
                const s = Math.round(new Date(a.dateTime).getTime() / 60000);
                return { s, e: s + getServiceDuration(a.service), p: a.stylistId ?? null };
            });
        }
        // ¿Queda lugar para un turno de "dur" minutos que empieza en startMin?
        // Sin profesionales cargados, el local atiende de a un turno por vez.
        function slotFree(startMin, dur, stylistId, blocks, staffIds) {
            const endMin = startMin + dur;
            const over = blocks.filter(b => b.s < endMin && b.e > startMin);
            if (!staffIds.length) return over.length === 0;
            if (stylistId !== null && stylistId !== undefined) return !over.some(b => b.p === stylistId);
            const busyAssigned = new Set(over.filter(b => b.p !== null && staffIds.includes(b.p)).map(b => b.p));
            const unassigned = over.filter(b => b.p === null || !staffIds.includes(b.p)).length;
            return staffIds.length - busyAssigned.size - unassigned > 0;
        }

        function validateSlot(service, stylistId, start, cfg, apps) {
            const duration = getServiceDuration(service);
            const end = new Date(start.getTime() + duration * 60000);
            if (start < new Date()) return 'Elegí una fecha y hora futura.';
            if (!cfg.days.includes(start.getDay())) return `El local no atiende los ${DAY_LONG[start.getDay()]}.`;
            const s = start.getHours() * 60 + start.getMinutes();
            if (s < cfg.openMin || s + duration > cfg.closeMin) {
                return `El local atiende de ${minToHHMM(cfg.openMin)} a ${minToHHMM(cfg.closeMin)}. Este servicio dura ${duration} min y tiene que terminar antes del cierre.`;
            }
            if (apps) {
                const startMin = Math.round(start.getTime() / 60000);
                if (!slotFree(startMin, duration, stylistId, agendaBlocks(apps), staff.map(m => m.id))) {
                    const sameStylist = stylistId !== null;
                    const conflict = apps.find(a => {
                        if (a.status === 'cancelled') return false;
                        if (sameStylist && a.stylistId !== stylistId) return false;
                        const aStart = new Date(a.dateTime);
                        const aEnd = new Date(aStart.getTime() + getServiceDuration(a.service) * 60000);
                        return start < aEnd && end > aStart;
                    });
                    const who = sameStylist ? staff.find(m => m.id === stylistId) : null;
                    if (conflict) {
                        const cStart = new Date(conflict.dateTime);
                        const cEnd = new Date(cStart.getTime() + getServiceDuration(conflict.service) * 60000);
                        return `${who ? who.name + ' ya tiene' : 'Ya hay'} un turno de ${fmtTime(cStart)} a ${fmtTime(cEnd)}. Elegí otro horario${staff.length ? ' u otro profesional' : ''}.`;
                    }
                    return 'No hay profesionales libres en ese horario. Elegí otro.';
                }
            }
            return null;
        }
        function fmtTime(d) {
            return d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false });
        }
        function fmtDateTime(iso) {
            return new Date(iso).toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short', hour12: false });
        }

        function getTodayIncomeExpense() {
            let income = 0, expense = 0;
            const today = getTodayStr();
            transactions.forEach(t => {
                if (t.date === today) {
                    if (t.type === 'income') income += t.amount;
                    else expense += t.amount;
                }
            });
            return { income, expense };
        }

        function getTodayIncomeByMethod() {
            const today = getTodayStr();
            const methods = { efectivo: 0, tarjeta: 0, transferencia: 0, otros: 0 };
            transactions.forEach(t => {
                if (t.date !== today) return;
                // Egresos antiguos sin método se consideran pagados en efectivo
                const method = (t.paymentMethod || (t.type === 'expense' ? 'efectivo' : 'otros')).toLowerCase();
                const key = methods.hasOwnProperty(method) ? method : 'otros';
                methods[key] += t.type === 'income' ? t.amount : -t.amount;
            });
            return methods;
        }

        function handleRegister() {
            const name = document.getElementById('regName').value.trim().replace(/\s+/g, ' ');
            const pwd = document.getElementById('regPassword').value;

            if (!name || !pwd) {
                return Swal.fire('Faltan datos', 'Completá el nombre de la peluquería y la contraseña.', 'warning');
            }
            if (pwd.length < 6) {
                return Swal.fire('Contraseña corta', 'La contraseña tiene que tener al menos 6 caracteres.', 'warning');
            }
            if (businesses.some(b => normName(b.name) === normName(name))) {
                return Swal.fire('Nombre en uso', 'Ya hay un local registrado con ese nombre en este dispositivo. Iniciá sesión o elegí otro nombre.', 'error');
            }
            if (!window.__regNameOk) {
                Swal.fire({ title: 'Verificando el nombre…', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

                    window.__regNameOk = true; try { handleRegister(); } finally { window.__regNameOk = false; }
                });
                return;
            }

            const id = Date.now();
            // "email" queda solo como identificador interno de los datos guardados
            const newBiz = { id, name, email: 'local_' + id, password: pwd, portalId: 'p-' + slugOf(name) };
            const otherPage = bizSlug(newBiz) !== window.VENTIUN_PORTAL_SLUG;

        function handleLogin() {
            const name = document.getElementById('loginName').value;

            if (!normName(name) || !pwd) {

            function refreshGrid() {
                const grid = document.getElementById('productsGridPOS');
                if (!grid) return;

                if (products.length === 0) {
                    grid.innerHTML = `<div class="col-span-full text-center py-10 text-xs text-slate-400">Todavía no cargaste servicios ni productos. Agregalos en <strong>Inventario e Insumos</strong> para poder vender.</div>`;
                    return;
                }
                grid.innerHTML = products.map(p => {
                    const isOutOfStock = p.type === 'product' && p.stock <= 0;
                    return `
                        <button onclick="window.requestPaymentMethod(${p.id})" class="bg-slate-50 hover:bg-emerald-50/50 p-4 rounded-xl border border-slate-100 hover:border-emerald-200 text-left transition-all ${isOutOfStock ? 'opacity-40 cursor-not-allowed' : ''}" ${isOutOfStock ? 'disabled' : ''}>
                            <div class="flex justify-between items-start">
                                <span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">
                                    ${p.type === 'product' ? '🧴 INSUMO' : '💇 SERVICIO'}
                                </span>
                                ${p.type === 'product' ? `
                                    <span class="text-[9px] font-bold px-1.5 py-0.5 rounded ${p.stock <= 3 ? 'bg-rose-50 text-rose-600 border border-rose-100' : 'bg-emerald-50 text-emerald-600 border border-emerald-100'}">
                                        Stock: ${p.stock}
                                    </span>
                                ` : ''}
                            </div>
                            <div class="font-bold text-slate-800 text-sm mt-2 line-clamp-1">${esc(p.name)}</div>
                            <div class="text-emerald-600 font-extrabold text-base mt-1">${fmt(p.price)}</div>
                        </button>
                    `;
                }).join('');
            }

            // Inyección global para gestionar pagos desde el catálogo
            window.requestPaymentMethod = (productId) => {
                if (!cashOpen) {
                    return Swal.fire('Caja Cerrada', 'Es necesario realizar la apertura de la caja para operar.', 'warning');
                }

                const prod = products.find(p => p.id === productId);
                if (!prod) return;

                if (prod.type === 'product' && prod.stock <= 0) {
                    return Swal.fire('Sin Stock', 'No hay inventario suficiente para vender este producto.', 'error');
                }

                // Armado del listado de estilistas activos
                let stylistOptions = '<option value="">Ninguno / Venta directa</option>';
                staff.forEach(member => {
                    stylistOptions += `<option value="${member.id}">${esc(member.name)} (${esc(member.role)} - ${member.commissionPct}%)</option>`;
                });

                Swal.fire({
                    title: `Total a pagar: ${fmt(prod.price)}`,
                    text: `Registrar cobro para ${prod.name}`,
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonColor: '#10b981',
                    confirmButtonText: 'Confirmar Cobro',
                    cancelButtonText: 'Cancelar',
                    html: `
                        <div class="text-left mt-3 space-y-3">
                            <div>
                                <label class="block text-xs font-bold text-slate-500 mb-1">MÉTODO DE PAGO</label>
                                <select id="paymentMethodSelect" class="swal2-select w-full border rounded-xl p-2.5 text-sm focus:outline-none">
                                    <option value="efectivo">💵 Efectivo</option>
                                    <option value="tarjeta">💳 Tarjeta (Débito / Crédito)</option>
                                    <option value="transferencia">🏦 Transferencia Bancaria</option>
                                    <option value="otros">📱 Pago Móvil / Otros</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 mb-1">COLABORADOR / ESTILISTA ASIGNADO</label>
                                <select id="paymentStylistSelect" class="swal2-select w-full border rounded-xl p-2.5 text-sm focus:outline-none">
                                    ${stylistOptions}
                                </select>
                            </div>
                        </div>
                    `,
                    preConfirm: () => {
                        const method = document.getElementById('paymentMethodSelect').value;
                        const stylist = document.getElementById('paymentStylistSelect').value;
                        return { method, stylistId: stylist ? parseInt(stylist) : null };
                    }
                }).then((result) => {
                    if (result.isConfirmed) {
                        executeSale(productId, result.value.method, result.value.stylistId);
                    }
                });
            };

            function executeSale(productId, paymentMethod, stylistId) {
                const prod = products.find(p => p.id === productId);
                if (!prod) return;

                if (prod.type === 'product') {
                    prod.stock--;
                }

                let profitLog = `Venta: ${prod.name}`;
                if (stylistId) {
                    const professional = staff.find(s => s.id === stylistId);
                    if (professional) {
                        const commValue = (prod.price * (professional.commissionPct / 100)).toFixed(2);
                        profitLog += ` (Colaborador: ${professional.name} - Com: ${fmt(commValue)})`;
                    }
                }

                transactions.push({
                    id: Date.now(),
                    type: 'income',
                    desc: profitLog,
                    amount: prod.price,
                    date: getTodayStr(),
                    paymentMethod: paymentMethod,
                    stylistId: stylistId
                });

                saveBusinessData();
                refreshGrid();
                renderPOSPanel(container); // Refresca balance y desglose en tiempo real
                Swal.fire('Venta Registrada', `${fmt(prod.price)} cobrados en método: ${paymentMethod}`, 'success');
            }

            refreshGrid();

            document.getElementById('toggleCashBtn')?.addEventListener('click', async () => {
                if (!cashOpen) {
                    cashOpen = true;
                    saveBusinessData();
                    renderPOSPanel(container);
                    return Swal.fire({
                        title: 'Caja Abierta',
                        text: 'El sistema está listo para registrar ingresos.',
                        icon: 'success',
                        toast: true,
                        position: 'top-end',
                        showConfirmButton: false,
                        timer: 2000
                    });
                }

                // Arqueo de cierre
                const today = getTodayStr();
                const { income, expense } = getTodayIncomeExpense();
                const byMethod = getTodayIncomeByMethod();
                const salesCount = transactions.filter(t => t.date === today && t.type === 'income').length;
                const commRows = staff.map(m => {
                    const vol = transactions.filter(t => t.date === today && t.type === 'income' && t.stylistId === m.id).reduce((a, t) => a + t.amount, 0);
                    return { name: m.name, vol, comm: vol * m.commissionPct / 100 };
                }).filter(r => r.vol > 0);
                const totalComm = commRows.reduce((a, r) => a + r.comm, 0);
                const row = (label, value, cls = '') => `<div class="flex justify-between py-1 ${cls}"><span>${label}</span><span class="font-bold tabular-nums">${value}</span></div>`;

                const result = await Swal.fire({
                    title: 'Cierre de caja',
                    confirmButtonText: 'Cerrar caja',
                    cancelButtonText: 'Seguir operando',
                    showCancelButton: true,
                    confirmButtonColor: '#0f172a',
                    width: 520,
                    html: `
                        <div class="text-left text-sm text-slate-600 space-y-4">
                            <div>
                                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Resumen del día (${salesCount} ventas)</p>
                                ${row('Ingresos', fmt(income))}
                                ${row('Egresos', '−' + fmt(expense))}
                                ${row('Neto del día', fmt(income - expense), 'border-t border-slate-200 mt-1 pt-2 text-slate-800')}
                            </div>
                            <div>
                                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Neto por método</p>
                                ${row('Efectivo', fmt(byMethod.efectivo))}
                                ${row('Tarjeta', fmt(byMethod.tarjeta))}
                                ${row('Transferencia', fmt(byMethod.transferencia))}
                                ${row('Otros', fmt(byMethod.otros))}
                            </div>
                            <div>
                                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Comisiones a liquidar</p>
                                ${commRows.length ? commRows.map(r => row(esc(r.name) + ` <span class="text-slate-400">(ventas ${fmt(r.vol)})</span>`, fmt(r.comm))).join('') + row('Total comisiones', fmt(totalComm), 'border-t border-slate-200 mt-1 pt-2 text-slate-800') : '<p class="text-xs text-slate-400">Sin ventas asignadas a estilistas hoy.</p>'}
                            </div>
                            <div class="bg-slate-50 border border-slate-200 rounded-xl p-3">
                                <label for="countedCash" class="block text-xs font-bold text-slate-500 mb-1">EFECTIVO CONTADO EN CAJA</label>
                                <p class="text-xs text-slate-400 mb-2">Debería haber <strong>${fmt(byMethod.efectivo)}</strong> en efectivo.</p>
                                <input id="countedCash" type="number" step="0.01" inputmode="decimal" class="w-full border border-slate-200 rounded-xl p-2.5 text-sm" value="${byMethod.efectivo}">
                            </div>
                        </div>
                    `,
                    preConfirm: () => {
                        const v = parseFloat(document.getElementById('countedCash').value);
                        if (isNaN(v) || v < 0) {
                            Swal.showValidationMessage('Ingresá el efectivo contado (puede ser 0).');
                            return false;
                        }
                        return v;
                    }
                });

                if (!result.isConfirmed) return;

                const counted = result.value;
                const diff = Math.round((counted - byMethod.efectivo) * 100) / 100;
                cashClosures.push({
                    id: Date.now(),
                    date: today,
                    closedAt: new Date().toISOString(),
                    income, expense,
                    expectedCash: byMethod.efectivo,
                    countedCash: counted,
                    diff,
                    commissions: totalComm
                });
                cashOpen = false;
                saveBusinessData();
                renderPOSPanel(container);

                Swal.fire({
                    title: 'Caja cerrada',
                    icon: diff === 0 ? 'success' : 'warning',
                    html: diff === 0
                        ? `El efectivo coincide: ${fmt(counted)}.`
                        : `Esperado ${fmt(byMethod.efectivo)}, contado ${fmt(counted)}.<br><strong>${diff > 0 ? 'Sobrante' : 'Faltante'}: ${fmt(Math.abs(diff))}</strong>`,
                    confirmButtonColor: '#10b981'
                });
            });

            document.getElementById('addExpenseBtn')?.addEventListener('click', async () => {
                if (!cashOpen) {
                    return Swal.fire('Caja Cerrada', 'Debes abrir la caja para registrar egresos.', 'warning');
                }

                const { value: form } = await Swal.fire({
                    title: 'Registrar Egreso / Pago Externo',
                    html: `
                        <input id="expDesc" class="swal2-input" placeholder="Ej: Compra de toallas de microfibra">
                        <input id="expAmount" type="number" class="swal2-input" placeholder="Monto ($)">
                        <select id="expMethod" class="swal2-select">
                            <option value="efectivo">💵 Pagado en efectivo (sale de la caja)</option>
                            <option value="tarjeta">💳 Tarjeta</option>
                            <option value="transferencia">🏦 Transferencia</option>
                            <option value="otros">📱 Otros</option>
                        </select>
                    `,
                    confirmButtonColor: '#10b981',
                    showCancelButton: true,
                    preConfirm: () => ({
                        desc: document.getElementById('expDesc').value.trim(),
                        amount: parseFloat(document.getElementById('expAmount').value),
                        method: document.getElementById('expMethod').value
                    })
                });

                if (form && form.desc && !isNaN(form.amount) && form.amount > 0) {
                    transactions.push({
                        id: Date.now(),
                        type: 'expense',
                        desc: `Egreso: ${form.desc}`,
                        amount: form.amount,
                        date: getTodayStr(),
                        paymentMethod: form.method
                    });
                    saveBusinessData();
                    renderPOSPanel(container);
                    Swal.fire('Registrado', 'El egreso fue deducido de la caja de hoy.', 'success');
                } else if (form) {
                    Swal.fire('Error', 'Todos los campos son requeridos y el monto debe ser positivo.', 'error');
                }
            });
        }

                const tbody = document.getElementById('staffTableBody');

                const today = getTodayStr();

                if (staff.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center py-10 text-slate-400 text-xs">Todavía no cargaste profesionales. Agregá a tu equipo con su porcentaje de comisión.</td></tr>`;
                    return;
                }
                tbody.innerHTML = staff.map(member => {
                    const memberSales = transactions.filter(t => t.date === today && t.type === 'income' && t.stylistId === member.id);
                    const totalVolume = memberSales.reduce((sum, current) => sum + current.amount, 0);
                    const totalCommission = (totalVolume * (member.commissionPct / 100)).toFixed(2);

                    return `

                                </button>
                            </td>
                        </tr>
                    `;
                }).join('');

            window.deleteStaffMember = (id) => {
                Swal.fire({
                    title: '¿Remover Colaborador?',
                    text: 'Las ventas pasadas se mantendrán registradas en finanzas, pero el estilista ya no aparecerá para el checkout.',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#e11d48',
                    confirmButtonText: 'Sí, remover',
                    cancelButtonText: 'Cancelar'
                }).then(res => {
                    if (res.isConfirmed) {
                        staff = staff.filter(member => member.id !== id);
                        saveBusinessData();
                        refreshStaffTable();
                        Swal.fire('Equipo Actualizado', 'El profesional ha sido dado de baja en el sistema.', 'success');
                    }
                });

            refreshStaffTable();

        async function sha256Hex(s) {
            const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
            return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');

        // Soporte: elegir peluquería (siempre pregunta si hay más de una)
        async function supportPick(list) {
            if (list.length === 1) return list[0];
            const opts = {}; list.forEach(x => { opts[x.slug] = x.cat.salonName; });
            const cur = currentBusiness && currentBusiness.soporte ? bizSlug(currentBusiness) : window.VENTIUN_PORTAL_SLUG;
            const sel = await Swal.fire({
                title: '¿Qué peluquería querés ver?', input: 'select', inputOptions: opts,
                inputValue: (list.find(x => x.slug === cur) || list[0]).slug,
                showCancelButton: true, confirmButtonText: 'Entrar', cancelButtonText: 'Cancelar', confirmButtonColor: '#10b981'
            });
            if (!sel.isConfirmed) return null;
            return list.find(x => x.slug === sel.value) || list[0];
        }
        function supportOpen(pick) {
            PUBLIC_CATALOG = pick.cat;
            const biz = { id: 'soporte', name: pick.cat.salonName, portalId: 'p-' + pick.slug, legacyOwner: pick.owner, email: 'soporte_' + pick.slug, password: null, soporte: true };
            currentBusiness = biz;
            store.del(`ventiun_v2_data_${biz.email}`);
            loadBusinessData();
            importFromPublished(biz.name, pick.cat);
            Swal.close();
            Swal.fire({ title: 'Soporte VentiunGo', text: `Estás viendo ${biz.name} con los datos de su página publicada.`, icon: 'success', toast: true, position: 'top-end', showConfirmButton: false, timer: 3000 });
            renderApp();
        }
        async function supportSwitch() {
            Swal.fire({ title: 'Buscando peluquerías…', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
                const list = await supportPortals();
                Swal.close();
                const pick = await supportPick(list);
                if (pick) supportOpen(pick);
            } catch (e) { Swal.fire('No se pudo', 'Revisá la conexión y probá de nuevo.', 'error'); }
        }
        async function supportLogin(pwd) {
            if (!fbInit()) return Swal.fire('Sin conexión', 'No se pudo conectar con la base de datos. Revisá internet y probá de nuevo.', 'error');
            Swal.fire({ title: 'Verificando soporte…', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
                const a = supApp().auth();
                await supSignIn(a, pwd);
                const list = await supportPortals();
                if (!list.length) {
                    await a.signOut();
                    return Swal.fire('Sin páginas publicadas', 'Todavía ninguna peluquería publicó su página.', 'info');
                }
                const pick = await supportPick(list);
                if (!pick) { await a.signOut(); return; }
                closeAuthModal('loginModal');
                supportOpen(pick);
            } catch (e) {
                const c = (e && e.code) || '';
                Swal.fire('No se pudo ingresar', /clave|wrong-password|invalid-credential|invalid-login/.test(c) ? 'El usuario o la contraseña no son correctos.' : 'No se pudo conectar con la base de datos. Probá de nuevo.', 'error');
            }
        }

        async function publishPublicPage(catalog, opts = {}) {
            if (!fbInit()) {
                if (opts.quiet) { autoSyncFailed = true; return false; }
                return Swal.fire('Sin conexión', 'No se pudo conectar con la base de datos. Revisá internet y probá de nuevo.', 'error');
            }
            if (opts.noResume) { session.del('ventiun_admin'); }
            Swal.fire({ title: opts.title || 'Publicando…', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
                const sup = !!(currentBusiness && currentBusiness.soporte);
                const user = sup ? supApp().auth().currentUser : await ensureOwnerAuth();
                if (!user) throw { code: 'permission-denied' };
                const pid = bizPortalId(currentBusiness);
                const pdoc = sup ? supApp().firestore().collection('portales').doc(pid) : portalDoc(pid);
                let owner = user.uid;
                const prevSn = await pdoc.get(); const prevData = prevSn.exists ? prevSn.data() : {};
                if (sup) owner = prevData.owner || currentBusiness.legacyOwner || null;
                const clean = catalog ? JSON.parse(JSON.stringify(catalog)) : null;
                const docData = { owner, catalog: clean, updatedAt: new Date().toISOString() };
                if (prevData.ownerEmail) docData.ownerEmail = prevData.ownerEmail;   // no perder con qué cuenta entra el dueño
                await pdoc.set(docData);
                PUBLIC_CATALOG = clean;
                autoSyncFailed = false;
                publicMeta = { publishedAt: catalog ? catalog.publishedAt : null };
                saveBusinessData();
                Swal.close();
                if (opts.noResume) {
                    currentBusiness = null; currentClient = null; showAdminLanding = false;
                    renderApp();
                } else {
                    renderApp(opts.tab || 'publicPage');
                }
                const msg = opts.toast || (catalog ? 'Página publicada: tus clientes ya ven los cambios' : 'Página de clientes quitada');
                Swal.fire({ title: msg, icon: 'success', toast: true, position: 'top-end', showConfirmButton: false, timer: 3000 });
                return true;
            } catch (e) {
                if (opts.quiet) { autoSyncFailed = true; Swal.close(); return false; }
                const code = (e && e.code) || '';
                if (/permission/.test(code)) {
                    return Swal.fire('Sin permiso para publicar', 'Esta página la publica el navegador del dueño del local. Entrá al panel desde el dispositivo donde la publicaste por primera vez.', 'error');
                }
                if (/admin-restricted|operation-not-allowed/.test(code)) {
                    return Swal.fire('Falta habilitar la publicación', 'La base de datos todavía no tiene activado el acceso del local. Avisale a VentiunGo.', 'error');
                }
                Swal.fire('No se pudo publicar', 'Revisá la conexión a internet y probá de nuevo en unos segundos.', 'error');
            }
        }

        // =====================================================================
        //  SOCIOS Y CÓDIGOS DE ACCESO
        //  La página publicada no guarda los códigos: cada socio va cifrado con
        //  una clave que sale de su propio código (PBKDF2 + AES-GCM).
        // =====================================================================
        const CODE_ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
        const CODE_ITER = 120000;
        const te = new TextEncoder();
        const td = new TextDecoder();

        function normCode(c) {
            return String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
        }
        function fmtCode(c) {
            const n = normCode(c);
            return n.slice(0, 4) + '-' + n.slice(4);
        }
        function genCode() {
            for (;;) {
                const bytes = crypto.getRandomValues(new Uint8Array(8));
                let c = '';
                bytes.forEach(b => { c += CODE_ALPHABET[b % CODE_ALPHABET.length]; });
                if (!members.some(m => normCode(m.code) === c)) return fmtCode(c);
            }
        }
        function toB64(u8) { let s = ''; u8.forEach(b => { s += String.fromCharCode(b); }); return btoa(s); }
        function fromB64(b) { return Uint8Array.from(atob(b), ch => ch.charCodeAt(0)); }
        function toHex(u8) { return [...u8].map(b => b.toString(16).padStart(2, '0')).join(''); }
        function ensureSalt() {
            if (!settings.codeSalt) {
                settings.codeSalt = toB64(crypto.getRandomValues(new Uint8Array(16)));
                saveBusinessData();
            }
        }
        async function deriveCodeBits(code, saltB64) {
            const km = await crypto.subtle.importKey('raw', te.encode(normCode(code)), 'PBKDF2', false, ['deriveBits']);
            const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: fromB64(saltB64), iterations: CODE_ITER }, km, 512);
            return new Uint8Array(bits);
        }
        async function sealMember(m, saltB64) {
            const bits = await deriveCodeBits(m.code, saltB64);
            const key = await crypto.subtle.importKey('raw', bits.slice(32), 'AES-GCM', false, ['encrypt']);
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, te.encode(JSON.stringify({ no: m.no, name: m.name })));
            return { h: toHex(bits.slice(0, 16)), iv: toB64(iv), d: toB64(new Uint8Array(ct)) };
        }
        async function openMember(code, cat) {
            if (!cat.codeSalt || !cat.members || !cat.members.length) return null;
            const bits = await deriveCodeBits(code, cat.codeSalt);
            const entry = cat.members.find(x => x.h === toHex(bits.slice(0, 16)));
            if (!entry) return null;
            const key = await crypto.subtle.importKey('raw', bits.slice(32), 'AES-GCM', false, ['decrypt']);
            const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(entry.iv) }, key, fromB64(entry.d));
            return JSON.parse(td.decode(pt));
        }
        function touchMembers() {
            settings.membersRev = (settings.membersRev || 0) + 1;
            saveBusinessData();
        }

        function bindPortalForm(cat, local) {
            const form = document.getElementById('portalForm');
            const input = document.getElementById('portalCode');
            const msg = document.getElementById('portalMsg');
            const btn = document.getElementById('portalBtn');
            if (!form || !cat) return;
            input.addEventListener('input', e => {
                const c = normCode(e.target.value).slice(0, 8);
                e.target.value = c.length > 4 ? c.slice(0, 4) + '-' + c.slice(4) : c;
            });
            form.addEventListener('submit', async e => {
                e.preventDefault();
                msg.hidden = true;
                const clean = normCode(input.value);
                if (clean.length !== 8) { msg.textContent = 'El código tiene 8 caracteres, por ejemplo ABCD-2345.'; msg.hidden = false; return; }
                btn.disabled = true; btn.textContent = 'Verificando…';
                let found = null;
                try {
                    if (local) {
                        const m = members.find(x => x.active && normCode(x.code) === clean);
                        found = m ? { no: m.no, name: m.name } : null;
                    } else {
                        found = await openMember(clean, cat);
                    }
                } catch (err) { found = null; }
                btn.disabled = false; btn.textContent = 'Ingresar';
                if (!found) { msg.textContent = 'Ese código no es válido o está dado de baja. Revisalo o pedíselo a tu peluquería.'; msg.hidden = false; return; }

                if (!local) { if (document.getElementById('portalRemember').checked) store.set(codeKey, clean); else store.del(codeKey); }
                clientView = { cat, local, member: found };
                renderApp();
                window.scrollTo(0, 0);
            });
        }

        async function openBookingAccess() {
            let cat = PUBLIC_CATALOG, local = false;
            if (!cat) { cat = localCatalog(); local = !!cat; }
            if (!cat) {
                return Swal.fire({ title: 'Turnos no disponibles', text: 'La peluquería todavía no habilitó los turnos online. Probá más tarde o consultá en el local.', icon: 'info', confirmButtonColor: '#10b981' });
            }
            const codeKey = 'ventiun_member_code_' + cat.salonName;
            const saved = store.get(codeKey) || '';
            const check = async raw => {
                const clean = normCode(raw);
                if (clean.length !== 8) return { error: 'El código tiene 8 caracteres, por ejemplo ABCD-2345.' };
                let found = null;
                try {
                    if (local) {
                        const m = members.find(x => x.active && normCode(x.code) === clean);
                        found = m ? { no: m.no, name: m.name } : null;
                    } else {
                        found = await openMember(clean, cat);
                    }
                } catch (e) { found = null; }
                return found ? { member: found, clean } : { error: 'Ese código no es válido o está dado de baja. Revisalo o pedíselo a la peluquería.' };
            };
            const r = await Swal.fire({
                title: 'Pedir turno',
                html: `<p class="text-sm text-slate-500">Ingresá tu código de socio de <strong>${esc(cat.salonName)}</strong>.</p>
                       <input id="bkCode" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD-2345" value="${esc(saved ? fmtCode(saved) : '')}" class="mt-4 w-full border border-slate-200 rounded-xl p-3 text-lg text-center font-mono tracking-[0.25em] uppercase focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500">
                       <label class="mt-3 flex items-center justify-center gap-2 text-xs text-slate-500"><input id="bkRemember" type="checkbox" class="accent-emerald-500" checked> Recordar mi código en este dispositivo</label>
                       ${cat.whatsapp ? `<p class="mt-4 text-xs text-slate-400">¿No tenés código? <a class="font-semibold text-emerald-600 hover:underline" target="_blank" rel="noopener" href="https://wa.me/${waNumber(cat.whatsapp)}?text=${encodeURIComponent('¡Hola! Quiero hacerme socio de ' + cat.salonName + ' para pedir turnos.')}">Pedíselo por WhatsApp</a></p>` : ''}`,
                showCancelButton: true,
                confirmButtonText: 'Ingresar',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#10b981',
                showLoaderOnConfirm: true,
                didOpen: () => {
                    const inp = document.getElementById('bkCode');
                    inp.focus();
                    inp.addEventListener('input', e => {
                        const c = normCode(e.target.value).slice(0, 8);
                        e.target.value = c.length > 4 ? c.slice(0, 4) + '-' + c.slice(4) : c;
                    });
                },
                preConfirm: async () => {
                    const res = await check(document.getElementById('bkCode').value);
                    if (res.error) { Swal.showValidationMessage(res.error); return false; }
                    res.remember = document.getElementById('bkRemember').checked;
                    return res;
                }
            });
            if (!r.isConfirmed || !r.value) return;
            if (!local) { if (r.value.remember) store.set(codeKey, r.value.clean); else store.del(codeKey); }
            clientView = { cat, local, member: r.value.member };
            renderApp();
        }
